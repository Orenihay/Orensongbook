    <script>
      /* Start-up watchdog (plain, independent of the app code): shows any error on the loading screen,
         and after 12 s a short diagnosis with "try again" / "clear the copy on this device". */
      (function () {
        var errs = [];
        window.__bootErrors = errs;
        window.__bootState = 'הדף נטען';
        function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function show(force) {
          var b = document.getElementById('boot');
          if (!b || (!force && !errs.length)) return;
          var d = document.getElementById('boot-diag');
          if (!d) { d = document.createElement('div'); d.id = 'boot-diag'; d.className = 'boot-diag'; b.appendChild(d); }
          var hasRun = !!(window.google && google.script && google.script.run);
          d.innerHTML = '<b>' + (errs.length ? 'הופיעה שגיאה בטעינה' : 'הטעינה לוקחת יותר מדי זמן') + '</b>' +
            '<div>גרסת הדף: ' + esc(document.body.getAttribute('data-build') || '?') + ' · שלב: ' + esc(window.__bootState) + ' · חיבור לשרת: ' + (hasRun ? 'קיים' : 'חסר') + '</div>' +
            (errs.length ? '<div class="boot-err">' + errs.slice(-5).map(esc).join('<br>') + '</div>' : '') +
            (document.body.getAttribute('data-index-check') === 'bad' ? '<div class="boot-fix"><b>הסיבה: הקובץ Index.html בפרויקט שונה מהקובץ שנשלח</b> — כנראה תווים אבדו בהעתקה. ' +
              'להורדת הקובץ (לא להעתיק מחלון תצוגה) ← לפתוח בפנקס רשימות ← Ctrl+A, Ctrl+C ← ב-Apps Script לפתוח את Index ← Ctrl+A, Ctrl+V ← לשמור ← Deploy ← New version.</div>' : '') +
            '<div class="boot-act"><button class="btn btn-accent" onclick="location.reload()">נסה שוב</button>' +
            '<button class="btn" onclick="try{Object.keys(localStorage).forEach(function(k){if(/^guitarStudio\\.cache\\./.test(k))localStorage.removeItem(k)})}catch(e){}location.reload()">נקה את העותק במכשיר ונסה שוב</button></div>' +
            '<div class="muted">צלם את המסך הזה ושלח — כך רואים בדיוק מה קרה. השירים שלך שמורים בגיליון.</div>';
        }
        /* For a syntax error: which page script fails, and the text of the failing line. */
        var probing = false;
        function locate() {
          var out = [];
          try {
            // A fixed list (getElementsByTagName is live and the probes below are scripts too).
            var ss = Array.prototype.slice.call(document.getElementsByTagName('script')).filter(function (x) { return !x.getAttribute('data-probe'); });
            for (var i = 0; i < ss.length; i++) {
              var t = ss[i].text || '';
              if (!t.replace(/\s/g, '') || t.indexOf('__bootErrors') >= 0) continue;
              try { new Function(t); continue; } catch (err) { /* this one does not parse */ }
              var line = 0;
              probing = true;
              var onErr = function (ev) { line = ev.lineno; ev.preventDefault(); };
              window.addEventListener('error', onErr);
              var probe = document.createElement('script');
              probe.setAttribute('data-probe', '1');
              probe.text = t + '\n//# sourceURL=diag-' + (i + 1) + '.js';
              document.head.appendChild(probe);
              window.removeEventListener('error', onErr);
              probing = false;
              var lines = t.split('\n');
              out.push('סקריפט ' + (i + 1) + ' מתוך ' + ss.length + ' (' + t.length + ' תווים' + (t.indexOf('ChordEngine') >= 0 && t.length < 60000 ? ', מנוע אקורדים' : '') + '), שורה ' + line + ': ' +
                String(lines[line - 1] || '').trim().slice(0, 140) + ' | לפני: ' + String(lines[line - 2] || '').trim().slice(0, 80));
            }
          } catch (e2) { probing = false; }
          return out;
        }
        window.addEventListener('error', function (e) {
          if (probing) return;
          errs.push((e.message || 'שגיאה') + (e.lineno ? ' (שורה ' + e.lineno + ')' : ''));
          if (/SyntaxError|Unexpected|Invalid/.test(e.message || '')) errs.push.apply(errs, locate());
          show();
        });
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push('Promise: ' + ((r && r.message) || r)); show(); });
        setTimeout(function () { show(true); }, 12000);
      })();
    </script>

      root.firstElementChild.addEventListener('click', (e) => {
        const b = e.target.closest('[data-mi]');
        if (b) close(opts.buttons[+b.dataset.mi].value);
        else if (e.target.classList.contains('modal-backdrop') && !opts.locked) close(null);
      });
      const first = root.querySelector('input, select, textarea, .btn-accent');
      if (first) first.focus();
    });
  }

  async function confirmBox(title, body, okLabel, danger) {
    const r = await modal({ title, body, buttons: [{ label: okLabel || 'אישור', value: true, cls: danger ? 'btn-danger' : 'btn-accent' }, { label: 'ביטול', value: false }] });
    return r.value === true;
  }

  const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
  const initials = (s) => String(s || '?').trim().split(/\s+/).slice(0, 2).map((w) => w.charAt(0)).join('').toUpperCase() || '?';
  const avatar = (name, img, round) =>
    `<div class="avatar ${round ? 'round' : ''}" style="--h:${hue(name)}">${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : esc(initials(name))}</div>`;
  const favBtn = (on, attr, id) => `<button class="icon-btn fav owner-only ${on ? 'on' : ''}" ${attr}="${esc(id)}" aria-label="${on ? 'הסר ממועדפים' : 'הוסף למועדפים'}" aria-pressed="${on}">${icon('heart')}</button>`;
  const loading = () => '<div class="loading"><div class="spinner"></div></div>';
  const fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('he-IL'); };
  const statusBadge = (s) => (s && s !== 'Not Started' ? `<span class="badge s-${esc(s.split(' ')[0])}">${esc(lbl(L.status, s))}</span>` : '');

  function songCard(s) {

  async function go(view, id, opts) {
    opts = opts || {};

    }
    S.dirty = false;
    stopPerf();
    asStop();
    if (PJ.open && !opts.keepProjector) closeProjector();
    if (!opts.replace && (S.route.view !== view || S.route.id !== id)) S.history.push(S.route);
    if (S.history.length > 50) S.history.shift();
    S.route = { view, id: id || null, preset: opts.preset || null };
    render();
    window.scrollTo(0, 0);
  }

  async function back() {
    if (S.dirty && !(await confirmBox('לצאת בלי לשמור?', 'השינויים שהזנת לא נשמרו.', 'צא בלי לשמור', true))) return;

    const prev = S.history.pop();
    S.route = prev || { view: 'dashboard', id: null };

      <div class="stats">${stats.map((s, i) => `<div class="stat" data-act="stat" data-i="${i}"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join('')}</div>

      ${section('נוגנו לאחרונה', songs.filter((s) => s.LastPlayed).sort(by('LastPlayed')).slice(0, 6))}
      ${section('נוספו לאחרונה', songs.slice().sort(by('DateAdded')).slice(0, 6), `<button class="btn btn-sm" data-act="sort-added">לכל השירים</button>`)}
      ${section('המועדפים שלי', songs.filter((s) => s.IsFavorite).slice(0, 6), `<button class="btn btn-sm" data-nav="favorites">הכל</button>`)}`;

  // ================================================================ songs list + search

  const SORTS = {
    artist: (a, b) => a._artist.localeCompare(b._artist, 'he') || a.SongName.localeCompare(b.SongName, 'he'),
    name: (a, b) => a.SongName.localeCompare(b.SongName, 'he'),
    added: (a, b) => String(b.DateAdded).localeCompare(String(a.DateAdded)),
    played: (a, b) => String(b.LastPlayed || '').localeCompare(String(a.LastPlayed || '')),
  };

  let knownCache = null;
  const knownSet = () => knownCache || (knownCache = new Set(store.get('knownChords', []).map(chordId)));

  function filterSongs(f) {
    const terms = f.q.trim().split(/\s+/).filter(Boolean).map((raw) => ({ raw: raw.toLowerCase(), norm: CE.normalizeName(raw) }));
    return S.songs
      .filter((s) =>
        (!f.fav || s.IsFavorite) &&
        (f.showHidden || listed(s)) &&
        (!f.known || !knownSet().size || playableWith(s, knownSet(), !!store.get('knownSimple', false))) &&
        (!f.singer || s.ArtistID === f.singer) &&
        (!f.status || s.LearningStatus === f.status || (f.status === 'Learning' && s.LearningStatus === 'Almost There')) &&
        (!f.difficulty || s.Difficulty === f.difficulty) &&
        (!f.key || s.OriginalKey === f.key || s.PersonalKey === f.key) &&
        (!f.capo || (f.capo === 'with' ? s.Capo > 0 : !(s.Capo > 0))) &&
        (!f.language || s.Language === f.language) &&
        (!f.genre || s.Genre === f.genre) &&
        (!f.style || s.PlayingStyle === f.style) &&
        terms.every((t) => s._chords.has(t.raw) || (t.norm && s._hay.indexOf(t.norm) >= 0))
      )
      .sort(SORTS[f.sort] || SORTS.artist);
  }

  function viewSongs(favoritesOnly) {
    const f = S.filters;
    const lists = S.lib.lists;
    const uniq = (field) => Array.from(new Set(S.songs.map((s) => s[field]).filter(Boolean))).sort();
    const keys = Array.from(new Set(S.songs.flatMap((s) => [s.OriginalKey, s.PersonalKey]).filter(Boolean))).sort();
    const select = (name, title, options, labels) =>
      `<select data-filter="${name}" aria-label="${title}"><option value="">${title}</option>${options
        .map((o) => `<option value="${esc(o)}" ${f[name] === o ? 'selected' : ''}>${esc(labels ? lbl(labels, o) : o)}</option>`)
        .join('')}</select>`;
    const singers = S.singers.slice().sort((a, b) => a.SingerName.localeCompare(b.SingerName, 'he'));
    V().innerHTML = `<div class="page-head"><div><h1>${favoritesOnly ? 'מועדפים' : 'כל השירים'}</h1></div><span class="spacer"></span>
        <button class="btn btn-sm" data-act="clear-filters">ניקוי סינון</button></div>
      <div class="filters">
        ${favoritesOnly ? '' : `<label class="chip-toggle"><input type="checkbox" data-filter="fav" ${f.fav ? 'checked' : ''}> ${icon('heart')} מועדפים</label>`}
        ${S.songs.some((s) => s.Hidden) ? `<label class="chip-toggle owner-only"><input type="checkbox" data-filter="showHidden" ${f.showHidden ? 'checked' : ''}> 🙈 כולל מוסתרים</label>` : ''}
        <span class="known-chip ${f.known && knownSet().size ? 'on' : ''}"><button class="btn btn-sm ${f.known && knownSet().size ? 'btn-accent' : ''}" data-act="known-open">🎸 מה אני יכול לנגן${f.known && knownSet().size ? ` (${knownSet().size} אקורדים)` : ''}</button>${f.known && knownSet().size ? '<button class="btn btn-sm" data-act="known-off" aria-label="ביטול הסינון">✕</button>' : ''}</span>
        <select data-filter="singer" aria-label="זמר"><option value="">כל הזמרים</option>${singers.map((a) => `<option value="${esc(a.SingerID)}" ${f.singer === a.SingerID ? 'selected' : ''}>${esc(a.SingerName)}</option>`).join('')}</select>
        ${select('status', 'סטטוס לימוד', lists.LearningStatus, L.status)}
        ${select('difficulty', 'רמת קושי', lists.Difficulty, L.difficulty)}
        ${select('key', 'סולם', keys)}
        <select data-filter="capo" aria-label="קאפו"><option value="">קאפו</option><option value="with" ${f.capo === 'with' ? 'selected' : ''}>עם קאפו</option><option value="without" ${f.capo === 'without' ? 'selected' : ''}>בלי קאפו</option></select>
        ${select('genre', "ז'אנר", uniq('Genre'), L.genre)}
        ${select('style', 'סגנון נגינה', uniq('PlayingStyle'))}
        ${select('language', 'שפה', uniq('Language'), L.language)}
        <select data-filter="sort" aria-label="מיון">
          <option value="artist" ${f.sort === 'artist' ? 'selected' : ''}>מיון: לפי זמר</option>
          <option value="name" ${f.sort === 'name' ? 'selected' : ''}>מיון: לפי שם</option>
          <option value="added" ${f.sort === 'added' ? 'selected' : ''}>מיון: נוספו לאחרונה</option>
          <option value="played" ${f.sort === 'played' ? 'selected' : ''}>מיון: נוגנו לאחרונה</option>
        </select>
      </div>
      <div id="results"></div>`;
    renderResults();
  }

  function renderResults() {
    const box = $('#results');
    if (!box) return;
    const favOnly = S.route.view === 'favorites';
    const list = filterSongs(Object.assign({}, S.filters, favOnly ? { fav: true } : {}));
    const empty = S.songs.length
      ? '<div class="empty">לא נמצאו שירים התואמים לחיפוש</div>'
      : `<div class="empty">הספרייה ריקה<br><button class="btn btn-accent" data-nav="add">${icon('plus')} הוספת שיר</button></div>`;
    const knownOn = S.filters.known && knownSet().size;
    box.innerHTML = `<div class="result-count">${list.length} שירים${knownOn ? ' שאפשר לנגן עם האקורדים שבחרת' : ''}</div>${songGrid(list, knownOn ? '<div class="empty">אין שיר שכל האקורדים שלו ברשימה שלך. נסה להוסיף אקורדים או לסמן "כולל פישוט".</div>' : empty)}`;
  }

  // ================================================================ simple chords / known chords

  /**
   * The easy version of a chord (shown only when "simple chords" is on; the song itself is never changed):
   * Cmaj7, Cadd9, C6, Csus4, Caug -> C · Am7, Am9, Am6 -> Am · G9, G13, G7sus4 -> G7 · Bm7b5, Bdim7 -> Bdim · slash bass dropped.
   */
  function simplifyChord(sym) {
    const p = CE.parseChord(String(sym || ''));
    if (!p) return sym;
    const x = p.suffix.replace(/[()]/g, '');
    let q = '';
    if (/^(dim|°|o)|m7b5|m7-5|ø/.test(x)) q = 'dim';
    else if (/^(m|min|mi|-)(?!aj)/.test(x)) q = 'm';
    else if (/^(7|9|11|13)/.test(x)) q = '7';
    return p.root + q;
  }
  const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  /** Same chord, whatever the spelling (A#m = Bbm). */
  function chordId(sym) {
    const p = CE.parseChord(String(sym || ''));
    if (!p) return String(sym || '').toLowerCase();
    const pc = (n) => (NOTE_PC[n[0]] + (n[1] === '#' ? 1 : n[1] === 'b' ? -1 : 0) + 12) % 12;
    return pc(p.root) + ':' + p.suffix + (p.bass ? '/' + pc(p.bass) : '');
  }
  const showChord = (sym) => (S.prefs.simplify ? simplifyChord(sym) : sym);
  const songChordList = (s) => String(s.ChordsUsed || '').split(/\s+/).filter(Boolean);
  /** "What can I play": every chord of the song is one the player knows (optionally after simplifying). */
  function playableWith(s, known, simple) {
    const list = songChordList(s);
    // With simplification: the easy version (G7sus4 -> G7) or its plain triad (G7 -> G) also counts.
    const triad = (c) => { const x = simplifyChord(c); return x.replace(/7$/, ''); };
    return list.length > 0 && list.every((c) => known.has(chordId(c)) || (simple && (known.has(chordId(simplifyChord(c))) || known.has(chordId(triad(c))))));
  }

  const BASIC_OPEN = ['C', 'D', 'E', 'G', 'A', 'Am', 'Em', 'Dm'];
  /** Pick the chords you know (all chords of the library, most used first); the song list keeps only songs you can play. */
  async function knownChordsModal() {
    const counts = new Map();
    S.songs.filter((x) => listed(x) || isOwner()).forEach((x) => songChordList(x).forEach((c) => counts.set(c, (counts.get(c) || 0) + 1)));
    const all = Array.from(counts.keys()).sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
    // The basic open chords are always offered, even when no song uses them yet.
    const have = new Set(all.map(chordId));
    BASIC_OPEN.forEach((c) => { if (!have.has(chordId(c))) { all.push(c); counts.set(c, 0); } });
    const known = knownSet();
    const box = (c) => `<label class="kc ${known.has(chordId(c)) ? 'on' : ''}"><input type="checkbox" value="${esc(c)}" ${known.has(chordId(c)) ? 'checked' : ''}> <span dir="ltr">${esc(c)}</span>${counts.get(c) ? `<small>${counts.get(c)}</small>` : ''}</label>`;
    const p = modal({
      title: '🎸 מה אני יכול לנגן?',
      html: `<div class="muted" style="font-size:13px;margin-bottom:8px">סמן את האקורדים שאתה יודע — ברשימת השירים יישארו רק שירים שכל האקורדים שלהם מסומנים.</div>
        <div class="row" style="margin-bottom:8px"><button class="btn btn-sm" data-kc="basic">אקורדים פתוחים בסיסיים</button><button class="btn btn-sm" data-kc="none">ניקוי</button></div>
        <div class="kc-grid">${all.map(box).join('') || '<div class="muted">אין עדיין אקורדים בספרייה</div>'}</div>
        <label class="chip-toggle" style="margin:10px 0 14px"><input type="checkbox" id="kc-simple" ${store.get('knownSimple', false) ? 'checked' : ''}> כולל פישוט (Am7 נחשב Am, Cmaj7 נחשב C, G7 נחשב G)</label>`,
      buttons: [{ label: 'הצג שירים', value: 'save', cls: 'btn-accent' }, { label: 'ביטול', value: null }],
      collect: (root) => ({ chords: $$('.kc-grid input:checked', root).map((i) => i.value), simple: root.querySelector('#kc-simple').checked }),
    });
    const root = $('#modal-root');
    const onChange = (e) => { const l = e.target.closest && e.target.closest('.kc'); if (l) l.classList.toggle('on', e.target.checked); };
    const onPreset = (e) => {
      const b = e.target.closest && e.target.closest('[data-kc]');
      if (!b) return;
      const ids = new Set(BASIC_OPEN.map(chordId));
      $$('.kc-grid input', root).forEach((i) => { i.checked = b.dataset.kc === 'basic' ? i.checked || ids.has(chordId(i.value)) : false; i.closest('.kc').classList.toggle('on', i.checked); });
    };
    root.addEventListener('change', onChange);
    root.addEventListener('click', onPreset);
    const r = await p;
    root.removeEventListener('change', onChange);
    root.removeEventListener('click', onPreset);
    if (r.value !== 'save') return;
    // Chords marked earlier that are not in the library right now are kept.
    const inLib = new Set(all.map(chordId));
    const kept = store.get('knownChords', []).filter((c) => !inLib.has(chordId(c)));
    store.set('knownChords', kept.concat(r.data.chords));
    store.set('knownSimple', r.data.simple);
    knownCache = null;
    S.filters.known = r.data.chords.length + kept.length > 0;
    saveFilters();

  }

  // ================================================================ song view

  function baseKey(song) {
    return song.OriginalKey || CE.detectKey(CE.chordSequence(song.SongContent || ''));
  }

  function flatsFor(key, semis, content) {
    if (key) return CE.preferFlatsForKey(CE.transposeKey(key, semis));
    return /[A-G]b/.test(content || '');
  }

  function tokenHtml(t, text, semis, flats, cls) {
    if (t.kind !== 'chord') return `<span class="${t.kind}">${esc(text)}</span>`;
    return `<span class="${cls}" data-chord="${esc(showChord(CE.transposeChord(t.core, semis, flats)))}">${esc(text)}</span>`;
  }

  /**
   * Renders the song body. 'smart' = chord/lyric segments in monospace that wrap on narrow
   * screens; 'mono' = the exact text layout. Blocks without a written label get an automatic
   * one (בית / פזמון / פתיחה ...). Chords carry data-chord for the fingering popup.
   */
  function sheetHtml(content, semis, mode, key) {
    const flats = semis ? flatsFor(key, semis, content) : false;
    const tr = (t) => {
      const text = CE.transposeToken(t, semis, flats);
      if (!S.prefs.simplify || t.kind !== 'chord') return text;
      const core = CE.transposeChord(t.core, semis, flats);
      return text.replace(core, simplifyChord(core));
    };
    const lines = CE.parseSheet(content);
    const autoAt = {};
    CE.songStructure(content).blocks.forEach((b) => { if (b.auto) autoAt[b.start] = b.label; });
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (autoAt[i]) out.push(`<div class="sec auto">${esc(autoAt[i])}</div>`);
      if (l.type === 'blank') out.push('<div class="blank"></div>');
      else if (l.type === 'section') out.push(`<div class="sec">${esc(l.text)}</div>`);
      else if (l.type === 'lyrics') out.push(`<div class="ln lyric">${esc(l.text)}</div>`);
      else {
        const next = lines[i + 1];
        if (mode !== 'mono' && next && next.type === 'lyrics') {
          // Drop indentation shared by the chord line and its lyric (more room when wrapping).
          const lead = Math.min(l.tokens[0].col, next.text.match(/^ */)[0].length);
          const toks = lead ? l.tokens.map((t) => Object.assign({}, t, { col: t.col - lead })) : l.tokens;
          const segs = CE.pairSegments(toks, next.text.slice(lead), tr, { wordBreaks: true });
          // One unit per word: lines wrap between words like normal text, and every chord stays
          // on top of the word it belongs to.
          const units = [];
          segs.forEach((sg) => {
            const words = sg.lyric.match(/\S+\s*|\s+/g) || [''];
            words.forEach((w, k) => units.push({ chord: k === 0 && sg.tok ? tokenHtml(sg.tok, sg.chord, semis, flats, 'ch') : '', lyric: w }));
          });
          out.push(`<div class="ln pair">${units
            .map((u) => `<span class="seg"><span class="c">${u.chord || ' '}</span><span class="l">${esc(u.lyric) || '\u00A0'}</span></span>`)
            .join('')}</div>`);
          i++;
        } else {
          // A chord-only line (intro, instrumental) is a sequence in playing order: always LTR.
          const standalone = !(next && next.type === 'lyrics');
          let pos = 0;
          const html = CE.layoutTokens(l.tokens, tr).map((pt) => {
            const pad = ' '.repeat(Math.max(0, pt.col - pos));
            pos = pt.col + pt.text.length;
            return pad + tokenHtml(pt.tok, pt.text, semis, flats, 'ch');
          }).join('');
          out.push(`<div class="ln chordline"${standalone ? ' dir="ltr"' : ''}>${html}</div>`);
        }
      }
    }
    return out.join('') || '<div class="muted">אין עדיין תוכן לשיר זה.</div>';
  }

  /** [A,B,A,B] -> {rows:[A,B], times:2}; keeps the structure line short. */
  function compressRows(rows) {
    const sig = (r) => r.join(' ');
    for (let p = 1; p <= rows.length / 2; p++) {
      if (rows.length % p) continue;
      if (rows.every((r, i) => sig(r) === sig(rows[i % p]))) return { rows: rows.slice(0, p), times: rows.length / p };
    }
    return { rows, times: 1 };
  }

  /** Song structure: one short line per distinct section (chord lines separated by │). */
  function structureHtml(content, semis, flats) {
    const groups = CE.songStructure(content).summary;
    if (!groups.length) return '';
    return groups.map((g) => {
      const c = compressRows(g.rows);
      const chords = c.rows.map((r) => r.map((ch) => {
        const t = showChord(CE.transposeChord(ch, semis, flats));
        return `<span class="st-ch" data-chord="${esc(t)}">${esc(t)}</span>`;
      }).join(' ')).join('<i class="st-sep">│</i>');
      return `<div class="st-row st-${esc(g.kind)}"><span class="st-label">${esc(g.label)}${g.count > 1 ? `<span class="st-count">×${g.count}</span>` : ''}</span>
        <span class="st-chords" dir="ltr">${chords}${c.times > 1 ? `<span class="st-times">×${c.times}</span>` : ''}</span></div>`;
    }).join('');
  }

  // ================================================================ chord diagrams

  /** SVG fingering chart (low E on the left), like a printed chord box. */
  function chordSvg(name, w) {
    const sh = CE.chordShape(name);
    if (!sh) return '';
    const played = sh.frets.filter((f) => f !== null && f > 0);
    const maxF = played.length ? Math.max(...played) : 0;
    const minF = played.length ? Math.min(...played) : 0;
    const base = maxF <= 4 ? 1 : minF;
    const n = Math.max(4, maxF - base + 1);
    const L = 16, T = 22, G = 13, F = 18, R = 6;
    const W = L + G * 5 + 22, H = T + F * n + 8;
    let g = '';
    for (let i = 0; i < 6; i++) g += `<line x1="${L + i * G}" y1="${T}" x2="${L + i * G}" y2="${T + n * F}" class="cs-str"/>`;
    for (let j = 0; j <= n; j++) g += `<line x1="${L}" y1="${T + j * F}" x2="${L + 5 * G}" y2="${T + j * F}" class="${j === 0 && base === 1 ? 'cs-nut' : 'cs-fret'}"/>`;
    if (base > 1) g += `<text x="${L + 5 * G + 6}" y="${T + F * 0.68}" class="cs-base">${base}fr</text>`;
    sh.frets.forEach((f, i) => {
      const x = L + i * G;
      if (f === null) g += `<text x="${x}" y="${T - 7}" class="cs-mark" text-anchor="middle">×</text>`;
      else if (f === 0) g += `<circle cx="${x}" cy="${T - 11}" r="4" class="cs-open"/>`;
    });
    if (sh.fingers) {
      const bar = sh.frets.map((f, i) => (sh.fingers[i] === 1 && f === minF && f > 0 ? i : -1)).filter((i) => i >= 0);
      if (bar.length > 1) {
        const y = T + (minF - base + 0.5) * F;
        g += `<rect x="${L + bar[0] * G - R}" y="${y - R}" width="${(bar[bar.length - 1] - bar[0]) * G + 2 * R}" height="${2 * R}" rx="${R}" class="cs-dot"/>`;
      }
    }
    sh.frets.forEach((f, i) => {
      if (!(f > 0)) return;
      const cx = L + i * G, cy = T + (f - base + 0.5) * F;
      g += `<circle cx="${cx}" cy="${cy}" r="${R}" class="cs-dot"/>`;
      if (sh.fingers && sh.fingers[i]) g += `<text x="${cx}" y="${cy + 3.5}" class="cs-fin" text-anchor="middle">${sh.fingers[i]}</text>`;
    });
    return `<svg class="chord-svg" viewBox="0 0 ${W} ${H}" width="${w || W}" height="${Math.round(((w || W) * H) / W)}" role="img" aria-label="${esc(name)}">${g}</svg>`;
  }

  function chordCard(name, w) {
    const sh = CE.chordShape(name);
    const fr = sh ? sh.frets.map((f) => (f === null ? 'x' : f)).join(' ') : '';
    return `<div class="cc-name">${esc(name)}</div>${chordSvg(name, w)}<div class="cc-frets">${esc(fr)}</div>${sh && sh.approx ? `<div class="cc-note">צורה בסיסית${sh.bass ? ' + בס ' + esc(sh.bass) : ''}</div>` : ''}`;
  }

  let popFor = null;
  let popTimer = 0;
  let popShownAt = 0;
  function showChordPop(el) {
    const name = el.dataset.chord;

    if (top < 8) top = r.bottom + 10;

    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
  }

  /** Semitones between the chords as written and the shapes shown for the player's capo. */
  function shownShift(song) {
    const written = song.Capo > 0 ? song.Capo : 0;
    return S.sv.semis + written - S.sv.playCapo;
  }

  function svSong() {
    return S.sv && S.full.get(S.sv.id);
  }

  function renderSongBody() {
    const song = svSong();
    if (!song) return;
    const written = song.Capo > 0 ? song.Capo : 0;
    const capo = S.sv.playCapo;
    const shown = shownShift(song);
    const key = baseKey(song);
    const flats = shown ? flatsFor(key, shown, song.SongContent) : false;
    const dir = CE.isRtl(song.SongContent) ? 'rtl' : 'ltr';
    document.documentElement.style.setProperty('--fs', S.prefs.font + 'px');
    const curKey = key ? CE.transposeKey(key, S.sv.semis) : '';
    $('#sv-tr').textContent = S.sv.semis ? `${curKey || ''} (${S.sv.semis > 0 ? '+' : ''}${S.sv.semis})` : `${curKey || '0'} · מקורי`;
    $('#sv-tr-save').disabled = S.sv.semis === (song.Transpose || 0);
    $('#sv-capo').textContent = capo ? String(capo) : 'ללא';
    // Smart capo: the position whose shapes are easiest for the same sounding chords.
    const sounding = CE.extractChords(song.SongContent).map((c) => CE.transposeChord(c, S.sv.semis + written, false));
    const tip = CE.suggestCapo(sounding, 5, capo);
    $('#sv-tip').innerHTML = [
      tip && tip.capo !== capo ? `<div class="tip">💡 עם <b>קאפו ${tip.capo}</b> מנגנים אקורדים קלים יותר: <span class="ltr tip-ch">${esc(tip.chords.slice(0, 6).join(' '))}</span>
        <button class="btn btn-sm btn-accent" data-act="capo-set" data-v="${tip.capo}">הפעל</button></div>` : '',
      capo !== written ? `<div class="tip muted">האקורדים מוצגים לקאפו ${capo || '0'} (במקור: ${written ? 'קאפו ' + written : 'בלי קאפו'}) — השיר נשמע אותו דבר.
        <button class="btn btn-sm" data-act="capo-set" data-v="${written}">חזרה לקאפו המקורי</button></div>` : '',
    ].join('');

  // ================================================================ auto-scroll (song view + performance mode)

  // px per second for speed levels 1..10 (at the default text size; scaled with the font).
  const SCROLL_SPEEDS = [7, 10, 14, 19, 25, 32, 40, 49, 59, 70];
  const AS = { on: false, counting: 0, timer: 0, raf: 0, last: 0, acc: 0, holdUntil: 0, lock: null };

  const asVisible = () => !$('#perf').hidden || S.route.view === 'song';
  const asLevel = () => store.get('scroll.' + (S.sv && S.sv.id), 1);
  const asTarget = () => ($('#perf').hidden ? null : $('#perf-scroll'));

  function asScrollBy(d) {
    const el = asTarget();
    if (el) el.scrollTop += d;
    else window.scrollBy(0, d);
  }

  function asAtEnd() {
    const el = asTarget();
    if (el) return el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
    const se = document.scrollingElement || document.documentElement;
    return window.scrollY + window.innerHeight >= se.scrollHeight - 2;
  }

  /** − / + while a song length is set: 5% longer (slower) / shorter (faster). */
  function durNudge(id, d) {
    const cur = songDur(id);
    if (!cur) return false;
    store.set('dur.' + id, Math.round(Math.min(1800, Math.max(20, d > 0 ? cur / 1.05 : cur * 1.05))));
    return true;
  }

  function asSetLevel(v) {
    const lvl = Math.min(10, Math.max(1, v));
    store.set('scroll.' + (S.sv && S.sv.id), lvl);
    asRender();
  }

  /** Starts after a short 3-2-1 countdown, so there is time to pick up the guitar. */
  function asStart() {
    if (AS.on || AS.counting) return;
    AS.counting = 3;
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => (AS.lock = l)).catch(() => {}); } catch (e) { /* unsupported */ }
    AS.timer = setInterval(() => {
      AS.counting--;
      if (AS.counting <= 0) {
        clearInterval(AS.timer);
        AS.on = true;
        { // song length mode: start the clock where the page already is
          const dur = S.sv ? songDur(S.sv.id) : 0;
          const left = asRemaining();
          const el = asTarget();
          const total = el ? el.scrollHeight - el.clientHeight : (document.scrollingElement || document.documentElement).scrollHeight - window.innerHeight;
          AS.elapsed = dur && total > 0 ? dur * (1 - left / total) : 0;
        }
        AS.last = 0;
        AS.acc = 0;
        AS.raf = requestAnimationFrame(asTick);
      }
      asRender();
    }, 650);
    asRender();
  }

  function asStop() {
    clearInterval(AS.timer);
    cancelAnimationFrame(AS.raf);
    AS.on = false;
    AS.counting = 0;
    if (AS.lock) { AS.lock.release().catch(() => {}); AS.lock = null; }
    asRender();
  }

  const asToggle = () => (AS.on || AS.counting ? asStop() : asStart());

  /** Pixels still to scroll in the current view. */
  function asRemaining() {
    const el = asTarget();
    if (el) return Math.max(0, el.scrollHeight - el.clientHeight - el.scrollTop);
    const se = document.scrollingElement || document.documentElement;
    return Math.max(0, se.scrollHeight - window.innerHeight - window.scrollY);
  }

  function asTick(ts) {
    if (!AS.on) return;
    if (AS.last && Date.now() >= AS.holdUntil) {
      const dt = (ts - AS.last) / 1000;
      const dur = S.sv ? songDur(S.sv.id) : 0;
      // With a song length: speed = what is left / time left, so it ends right at the end of the song.
      if (dur) { AS.elapsed = (AS.elapsed || 0) + dt; AS.acc += dt * (asRemaining() / Math.max(0.5, dur - AS.elapsed)); }
      else AS.acc += dt * SCROLL_SPEEDS[asLevel() - 1] * (S.prefs.font / 18);
      const d = Math.floor(AS.acc);
      if (d) { asScrollBy(d); AS.acc -= d; }
      if (asAtEnd()) { asStop(); toast('סוף השיר 🎵'); return; }
    }
    AS.last = ts;
    AS.raf = requestAnimationFrame(asTick);
  }

  /** While the player touches or drags the page, scrolling pauses and resumes shortly after. */
  const asHold = (ms) => { if (AS.on) AS.holdUntil = Date.now() + ms; };
  document.addEventListener('touchstart', (e) => { if (!e.target.closest('#scroll-dock')) asHold(60000); }, { passive: true });
  document.addEventListener('touchend', () => asHold(1200), { passive: true });
  document.addEventListener('wheel', () => asHold(1500), { passive: true });

  function asRender() {
    const dock = $('#scroll-dock');
    if (!dock) return;
    const show = asVisible();
    dock.hidden = !show;
    document.body.classList.toggle('has-dock', show);
    if (!show) return;
    const lvl = asLevel();
    const dur = S.sv ? songDur(S.sv.id) : 0;
    const label = AS.counting ? `<b class="sd-count">${AS.counting}</b> מתחיל…`
      : AS.on ? `${icon('pause')} עצירת גלילה` : `${icon('play')} גלילה אוטומטית`;
    dock.innerHTML = `<div class="sd" role="group" aria-label="גלילה אוטומטית">
        <button class="sd-btn" data-act="as-speed" data-d="-1" aria-label="האטה" ${!dur && lvl <= 1 ? 'disabled' : ''}>−</button>
        <button class="sd-main ${AS.on || AS.counting ? 'on' : ''}" data-act="as-toggle" aria-pressed="${AS.on}">${label}<span class="sd-speed">${dur ? '⏱ ' + fmtDur(dur) : 'מהירות ' + lvl}</span></button>
        <button class="sd-btn" data-act="as-speed" data-d="1" aria-label="האצה" ${!dur && lvl >= 10 ? 'disabled' : ''}>+</button>
        <button class="sd-btn sd-dur ${dur ? 'on' : ''}" data-act="as-dur" aria-label="גלילה לפי אורך השיר" title="גלילה לפי אורך השיר">⏱</button>
      </div>`;
  }

    S.prefs.font = Math.min(40, Math.max(12, S.prefs.font + d * 2));
    savePrefs();
    document.documentElement.style.setProperty('--fs', S.prefs.font + 'px');

  const val = (name) => {
    const el = $('#f-' + name);
    if (!el) return '';
    if (el.type === 'checkbox') return el.checked;
    return name === 'SongContent' ? stripRlm(el.value) : el.value;
  };

  /*
   * A plain text box shows a chord-only line (Latin letters) left-to-right even inside Hebrew text,
   * so the box showed Hebrew chord lines mirrored compared to the preview and the song page — what
   * looked right while editing came out reversed after saving. An invisible right-to-left mark
   * after each chord makes the box lay chords out exactly like the song page. The marks exist only
   * in the box: they are removed when reading it, and the server strips them too.
   */
  const RLM = '\u200F';
  const stripRlm = (t) => String(t || '').replace(/\u200F/g, '');
  function toEditorText(content) {
    const clean = stripRlm(content);
    if (!CE.isRtl(clean)) return clean;
    return clean.split('\n').map((l) => (CE.analyzeLine(l) ? l.replace(/(\S+)/g, '$1' + RLM) : l)).join('\n');
  }
  function setEditorText(content) {
    const ta = $('#f-SongContent');
    ta.value = toEditorText(content);
    ta.dir = CE.isRtl(stripRlm(content)) ? 'rtl' : 'auto';
    return ta.value;
  }
  const setVal = (name, value) => { const el = $('#f-' + name); if (!el) return; if (el.tagName === 'SELECT' && value && !$$('option', el).some((o) => o.value === String(value))) el.insertAdjacentHTML('beforeend', `<option value="${esc(value)}">${esc(value)}</option>`); el.value = value; };

  const artistNames = () => S.singers.map((a) => a.SingerName);

  /** Width of one character in a typical proportional web font (what chord sites lay out in). */
  const measureChar = (() => {
    const cache = new Map();
    let ctx = null;
    return (ch) => {
      if (cache.has(ch)) return cache.get(ch);
      if (!ctx) { ctx = document.createElement('canvas').getContext('2d'); ctx.font = '16px Arial, Helvetica, sans-serif'; }
      const w = ctx.measureText(ch).width || 8;
      cache.set(ch, w);
      return w;
    };
  })();

  /** Puts chords back over their words (proportional-font copies) and trims shared indentation. */
  function alignContent(content) {
    const r = CE.realignProportional(content, measureChar);
    return { content: CE.dedent(r.content), realigned: r.changed };
  }

  /** Fills fields the user has not typed into (values filled automatically may be replaced). */
  function fillFields(fill) {
    Object.keys(fill).forEach((k) => {
      const value = fill[k];
      if (value === '' || value === null || value === undefined || S.ed.touched.has(k)) return;
      if (String(val(k)).trim() && !S.ed.auto.has(k)) return;
      setVal(k, value);
      S.ed.auto.add(k);
    });
  }

  function applyParse() {
    const ta = $('#f-SongContent');
    const raw = CE.normalizeText(ta.value);
    const p = CE.parseSong(raw, { knownArtists: artistNames() });
    S.ed.mirror = p.ltrSource;
    S.ed.dir = p.mirrored ? 'auto' : '';
    const aligned = alignContent(p.content);
    S.ed.contentStamp = setEditorText(aligned.content);
    fillFields({ SongName: p.title, ArtistName: p.artist, OriginalKey: p.originalKey || p.detectedKey, Capo: p.capo, Tuning: p.tuning, BPM: p.bpm,
      StrummingPattern: p.strumming, YouTubeURL: p.youtube, SpotifyURL: p.spotify, ChordsSourceURL: p.source, Language: p.language,
      Difficulty: p.difficulty });
    const known = findSinger(val('ArtistName'));
    if (known && known.Language) fillFields({ Language: known.Language });
    S.dirty = true;
    $('#parse-info').textContent = `✓ זוהו ${p.chords.length} אקורדים${aligned.realigned ? ' · האקורדים יושרו מעל המילים' : ''}${p.mirrored ? ' · כיוון האקורדים בעברית תוקן (מקור משמאל לימין)' : ''}${!p.originalKey && p.detectedKey ? ` · סולם משוער ${p.detectedKey}` : ''}`;
    updateHints();
    updatePreview();
    runAi(raw, true);
  }

  /**
   * AI recognition (server-side Claude call). Fills title/artist/key/etc. without overriding
   * anything the user typed; with withContent it also drops lines the AI marked as site clutter,
   * but only if the user has not edited the body in the meantime.
   */
  async function runAi(raw, withContent) {
    const box = $('#ai-box');
    if (!box) return;
    if (!S.lib.ai || !S.lib.ai.enabled) {
      box.innerHTML = `<div class="ai-card off">🤖 זיהוי AI כבוי — הזיהוי הבסיסי פעיל. <button type="button" data-nav="settings">איך מפעילים</button></div>`;
      return;
    }
    const token = ++S.ed.aiToken;
    box.innerHTML = '<div class="ai-card busy"><div class="spinner sm"></div> מזהה את השיר עם AI…</div>';
    try {
      const res = await call('apiAiAnalyze', raw, artistNames());
      if (!S.ed || token !== S.ed.aiToken || !$('#ai-box')) return;
      if (res.status !== 'ok') { S.lib.ai.enabled = false; return runAi(raw, withContent); }
      const r = res.result;
      const existing = findSinger(r.artist);
      fillFields({ SongName: r.songName, ArtistName: existing ? existing.SingerName : r.artist, OriginalKey: r.originalKey, Capo: r.capo,
        Language: r.language, Genre: r.genre, Tuning: r.tuning, BPM: r.bpm, Difficulty: r.difficulty, PlayingStyle: r.playingStyle,
        StrummingPattern: r.strummingPattern });
      let removed = 0;
      const ta = $('#f-SongContent');
      if (withContent && ta.value === S.ed.contentStamp) {
        const junk = new Set(r.junkLines);
        const kept = raw.split('\n').filter((_, i) => !junk.has(i)).join('\n');
        const p2 = CE.parseSong(kept, { headerHint: { title: r.songName, artist: r.artist }, mirror: !!S.ed.mirror });
        const aligned = alignContent(p2.content);
        removed = Math.max(0, S.ed.contentStamp.split('\n').length - aligned.content.split('\n').length);
        S.ed.contentStamp = setEditorText(aligned.content);
      }
      updateHints();
      updatePreview();
      const conf = { high: 'ביטחון גבוה', medium: 'ביטחון בינוני', low: 'לא בטוח — בדוק את השם והזמר' }[r.confidence];
      const facts = [r.originalKey && `סולם ${r.originalKey}`, r.capo > 0 && `קאפו ${r.capo}`, r.difficulty && lbl(L.difficulty, r.difficulty),
        r.genre && lbl(L.genre, r.genre), r.playingStyle, removed && `הוסרו ${removed} שורות מיותרות`].filter(Boolean);
      box.innerHTML = `<div class="ai-card ${r.confidence === 'low' ? 'warn' : 'ok'}">🤖 זוהה: <b>${esc(r.songName)}</b>${r.artist ? ` — <b>${esc(r.artist)}</b>` : ''}
        <span class="muted">· ${esc(facts.join(' · '))}${facts.length ? ' · ' : ''}${esc(conf)}${res.cached ? ' · מהמטמון' : ''}</span>
        ${r.notes ? `<div class="muted">${esc(r.notes)}</div>` : ''}</div>`;
    } catch (e) {
      if (!S.ed || token !== S.ed.aiToken || !$('#ai-box')) return;
      box.innerHTML = `<div class="ai-card warn">🤖 ${esc(e.message)} <button type="button" data-act="ai-run">נסה שוב</button></div>`;
    }
  }

  function updatePreview() {
    const box = $('#preview');
    if (!box) return;
    const content = val('SongContent');
    box.dir = CE.isRtl(content) ? 'rtl' : 'ltr';

    box.className = 'sheet preview' + (S.prefs.mode === 'mono' ? ' mono' : '');
    box.innerHTML = content.trim() ? sheetHtml(content, 0, S.prefs.mode, val('OriginalKey')) : '<div class="muted">התצוגה תופיע כאן אחרי ההדבקה</div>';
    if (!$('#parse-info').textContent && content.trim()) $('#parse-info').textContent = `${CE.extractChords(content).length} אקורדים`;
  }

  /** Live artist match + duplicate-song detection while typing. */
  function updateHints() {
    const hint = $('#artist-hint');
    const dupBox = $('#dup-alert');
    if (!hint) return;
    const name = val('ArtistName').trim();
    const title = val('SongName').trim();
    const artist = findSinger(name);
    if (!name) {
      hint.className = 'hint';
      hint.textContent = '';
    } else if (artist) {
      hint.className = 'hint ok';
      hint.textContent = `✓ זמר קיים בספרייה · ${songsBy(artist.SingerID).length} שירים`;
    } else {
      let best = null;
      S.singers.forEach((a) => { const sc = CE.similarity(a.SingerName, name); if (!best || sc > best.sc) best = { a, sc }; });
      hint.className = 'hint warn';
      hint.innerHTML = best && best.sc >= 0.75
        ? `זמר חדש ייווצר. האם התכוונת ל-<button type="button" data-act="use-artist" data-name="${esc(best.a.SingerName)}">${esc(best.a.SingerName)}</button>?`
        : `+ זמר חדש ייווצר: <b>${esc(name)}</b>`;
    }
    dupBox.innerHTML = '';
    if (!artist || !title) return;
    const others = songsBy(artist.SingerID).filter((s) => s.SongID !== S.ed.id);
    const exact = others.find((s) => CE.normalizeName(s.SongName) === CE.normalizeName(title));
    const similar = exact ? null : others.find((s) => CE.similarity(s.SongName, title) >= 0.85);
    const hit = exact || similar;
    if (!hit) return;
    dupBox.innerHTML = `<div class="alert warn">${exact ? '⚠️ השיר' : 'שיר דומה'} "<b>${esc(hit.SongName)}</b>" של ${esc(artist.SingerName)} ${exact ? 'כבר קיים בספרייה.' : 'כבר קיים. ודא שזה לא אותו שיר.'}
      <div class="row"><button class="btn btn-sm" data-open-song="${esc(hit.SongID)}">פתיחת הקיים</button>
      ${S.ed.id ? '' : `<button class="btn btn-sm btn-accent" data-act="merge-into" data-id="${esc(hit.SongID)}">עדכון הקיים בתוכן החדש</button>`}</div></div>`;
  }

  function collectForm() {
    const r = {};
    FIELDS.forEach((f) => (r[f] = typeof val(f) === 'string' ? val(f).trim() : val(f)));
    r.SongContent = val('SongContent');
    r.IsFavorite = val('IsFavorite');
    r.Hidden = val('Hidden');
    r.SongID = S.ed.id || '';
    r.ChordDirection = S.ed.dir || '';
    const artist = findSinger(r.ArtistName);
    if (artist) r.ArtistID = artist.SingerID;
    if (S.ed.original && !S.ed.touched.has('PersonalKey') && r.OriginalKey === S.ed.original.OriginalKey) r.Transpose = S.ed.original.Transpose;
    return r;
  }

  /** Overlays newly entered data on an existing song, keeping its personal progress. */
  function mergeInto(existing, form) {
    const out = Object.assign({}, existing);
    Object.keys(form).forEach((k) => {
      const v = form[k];
      if (k === 'ArtistName' || k === 'ArtistID' || k === 'SongID' || v === '' || v === null || v === undefined) return;
      if (k === 'IsFavorite') out.IsFavorite = existing.IsFavorite || v;
      else if (k === 'LearningStatus' && v === 'Not Started') return;
      else out[k] = v;
    });
    return out;
  }

  async function saveSong(opts) {
    opts = opts || {};
    const r = opts.record || collectForm();
    if (!r.SongName) { toast('יש להזין שם שיר', 'err'); $('#f-SongName').focus(); return; }
    if (!r.ArtistID && !r.ArtistName) { toast('יש להזין זמר או להקה', 'err'); $('#f-ArtistName').focus(); return; }
    const btn = $('#btn-save');
    btn.disabled = true;
    try {
      const res = await call('apiSaveSong', r, { allowDuplicate: !!opts.allowDuplicate });
      if (res.status === 'duplicate') {
        const choice = await modal({
          title: 'השיר כבר קיים',
          body: `"${res.existing.SongName}" של ${res.singer.SingerName} כבר נמצא בספרייה. מה לעשות?`,
          buttons: [{ label: 'עדכון השיר הקיים', value: 'merge', cls: 'btn-accent' }, { label: 'שמירה כגרסה נוספת', value: 'dup' }, { label: 'ביטול', value: null }],
        });
        btn.disabled = false;
        if (choice.value === 'merge') return mergeExisting(res.existing.SongID);
        if (choice.value === 'dup') return saveSong({ allowDuplicate: true, record: r });
        return;
      }
      if (res.singerCreated || !S.singerById.has(res.singer.SingerID)) upsert(S.singers, 'SingerID', res.singer);
      reindex();
      S.full.set(res.song.SongID, res.song);
      applySongMeta(res.song);
      S.dirty = false;
      const autoNames = (res.autoPlaylists || []).map((pid) => {
        const p = (S.lib.playlists || []).find((x) => x.PlaylistID === pid);
        if (p && p.songs.indexOf(res.song.SongID) < 0) p.songs.push(res.song.SongID);
        return p ? p.PlaylistName : '';
      }).filter(Boolean);
      toast((res.singerCreated ? `נשמר ✓ (נוצר זמר חדש: ${res.singer.SingerName})` : 'השיר נשמר ✓') + (autoNames.length ? ` · נוסף ל: ${autoNames.join(', ')}` : ''), 'ok');
      noteBackup(res.backup);
      go('song', res.song.SongID, { replace: true, force: true });
    } catch (e) {
      btn.disabled = false;
      fail(e);
    }
  }

  /** Tracks the Drive JSON backup after a write; warns (without blocking) when it failed. */
  function noteBackup(b) {
    if (!b || !S.lib.backup || b.idle) return;
    if (b.status === 'pending') { S.lib.backup.pending = true; return; }
    if (b.status === 'ok') { S.lib.backup.lastAt = new Date().toISOString(); S.lib.backup.pending = false; if (b.folderUrl) S.lib.backup.folderUrl = b.folderUrl; }
    else if (b.status === 'error') {
      // Once per session is enough: the song itself is safe in the sheet.
      if (S.backupWarned === b.message) return;
      S.backupWarned = b.message;
      toast(`✓ השינויים נשמרו בגיליון. ${b.needsAuth ? 'גיבוי ה-JSON לדרייב עדיין לא פעיל — ' : 'גיבוי ה-JSON לדרייב נכשל: '}${b.message}`, 'err');
    }
  }

  async function mergeExisting(existingId) {
    try {
      const existing = S.full.get(existingId) || (await call('apiGetSong', existingId, false));
      const form = collectForm();
      const merged = mergeInto(existing, form);
      merged.SongID = existingId;
      merged.ArtistID = existing.ArtistID;
      await saveSong({ record: merged });
    } catch (e) {
      fail(e);
    }
  }

  // ================================================================ singers

      <button class="btn owner-only ${S.selSingers ? 'btn-accent' : ''}" data-act="sel-mode">${S.selSingers ? '✓ סיום בחירה' : '☑ בחירת כמה זמרים'}</button>
      <button class="btn btn-accent owner-only" data-act="new-singer">${icon('plus')} הוספת זמר</button></div>
      ${S.selSingers ? `<div class="sel-bar owner-only" id="sel-bar"></div>` : ''}
      <div class="filters"><input type="search" id="singer-q" placeholder="סינון זמרים…" aria-label="סינון זמרים">
      <label class="chip-toggle"><input type="checkbox" id="singer-fav"> ${icon('heart')} מועדפים</label></div>

            <div class="meta"><div class="title">${esc(a.SingerName)}</div><div class="sub">${songsBy(a.SingerID).length} שירים${a.Type ? ' · ' + esc(lbl(L.singerType, a.Type)) : ''}</div></div>
            ${favBtn(a.IsFavorite, 'data-fav-singer', a.SingerID)}</article>`).join('')}</div>`

  async function singerModal(singer, retry) {

        <div class="field"><label for="m-Type">סוג</label><select id="m-Type"><option value="">—</option>${lists.SingerType.map((o) => opt(o, v.Type, L.singerType)).join('')}</select></div>

        <div class="field wide"><label for="m-SpotifyURL">Spotify</label><input id="m-SpotifyURL" class="ltr" type="url" value="${esc(v.SpotifyURL || '')}"></div>
        <div class="field wide"><label for="m-YouTubeURL">YouTube</label><input id="m-YouTubeURL" class="ltr" type="url" value="${esc(v.YouTubeURL || '')}"></div>
        <div class="field wide"><label for="m-Notes">הערות</label><textarea id="m-Notes" rows="2">${esc(v.Notes || '')}</textarea></div>
