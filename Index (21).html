      if (res.status === 'duplicate') {
        const c = await modal({ title: 'הזמר כבר קיים', body: `"${res.existing.SingerName}" כבר קיים בספרייה.`,
          buttons: [{ label: 'מעבר לזמר הקיים', value: 'open', cls: 'btn-accent' }, { label: 'שמירה בכל זאת', value: 'force' }, { label: 'ביטול', value: null }] });
        if (c.value === 'open') { go('singer', res.existing.SingerID); return null; }
        if (c.value !== 'force') return null;
        res = await call('apiSaveSinger', data, { allowDuplicate: true });
      }
      upsert(S.singers, 'SingerID', res.singer);
      reindex();
      toast('הזמר נשמר ✓', 'ok');
      return res.singer;
    } catch (e) {
      fail(e);
      return null;
    }
  }

  async function toggleSingerFav(id) {
    const a = S.singerById.get(id);
    if (!a) return;
    a.IsFavorite = !a.IsFavorite;
    $$(`[data-fav-singer="${CSS.escape(id)}"]`).forEach((b) => b.classList.toggle('on', a.IsFavorite));
    try {
      await call('apiUpdateSinger', id, { IsFavorite: a.IsFavorite });
    } catch (e) {
      a.IsFavorite = !a.IsFavorite;
      $$(`[data-fav-singer="${CSS.escape(id)}"]`).forEach((b) => b.classList.toggle('on', a.IsFavorite));
      fail(e);
    }
  }

  // ================================================================ projector mode (TV / projector + phone remote)
  // A separate full-screen view: nothing from performance mode or the song page is changed by it.

  // px per second at the default projector size (scaled with the font). Levels 1..12.
  const PROJ_SPEEDS = [0.5, 1, 1.5, 2, 3, 4, 5, 6, 8, 10, 12, 15];
  const PJ = { open: false, code: '', seq: 0, songId: '', semis: 0, fs: 27, y: 0, theme: 'black', playing: false, counting: 0,
    countT: 0, raf: 0, last: 0, hideT: 0, toastT: 0, pubT: 0, lock: null, token: 0, song: null };
  const projDefaultFs = () => Math.min(48, Math.max(16, Math.round(S.prefs.font * 1.5)));
  // "Lyrics only" (for singing along) keeps its own, larger, text size.
  const projFsMax = () => (PJ.mode === 'lyrics' ? 80 : 48);
  const projFsFor = (mode) => (mode === 'lyrics' ? store.get('projFsL', Math.min(80, Math.round(projDefaultFs() * 1.4))) : store.get('projFs', projDefaultFs()));

  /** Lyrics and section names only, centred: for the people singing along. */
  function lyricsHtml(content) {
    const lines = CE.parseSheet(content);
    const autoAt = {};
    CE.songStructure(content).blocks.forEach((b) => { if (b.auto) autoAt[b.start] = b.label; });
    const out = [];
    let blank = true;
    lines.forEach((l, i) => {
      if (autoAt[i]) { out.push(`<div class="sec auto">${esc(autoAt[i])}</div>`); blank = false; }
      if (l.type === 'lyrics' && l.text.trim()) { out.push(`<div class="ln">${esc(l.text.trim())}</div>`); blank = false; }
      else if (l.type === 'section') { out.push(`<div class="sec">${esc(l.text)}</div>`); blank = false; }
      else if (l.type === 'blank' && !blank) { out.push('<div class="blank"></div>'); blank = true; }
    });
    return out.join('') || '<div class="muted">אין מילים לשיר הזה.</div>';
  }
  const projLevel = () => store.get('pscroll.' + PJ.songId, 5);
  const projPct = () => Math.round((PJ.fs / S.prefs.font) * 100);
  function projNewCode() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = '';
    for (let i = 0; i < 5; i++) c += A[Math.floor(Math.random() * A.length)];
    return c;
  }
  const projVp = () => $('#proj-vp');
  const projContent = () => $('#proj-content');
  const projMax = () => Math.max(0, projContent().scrollHeight - projVp().clientHeight);

  function openProjector(songId) {
    if (PJ.open || !songId) return;
    const pjs = S.songs.find((x) => x.SongID === songId);
    track('projector', pjs ? pjs.SongName : '');
    stopPerf();
    asStop();
    PJ.open = true;
    PJ.code = store.get('projCode', '') || projNewCode(); // stable per screen, so the phone can reconnect
    store.set('projCode', PJ.code);
    PJ.mode = store.get('projMode', 'full') === 'lyrics' ? 'lyrics' : 'full';
    PJ.fs = projFsFor(PJ.mode);
    PJ.theme = store.get('projTheme', 'black');
    const el = $('#proj');
    el.className = 'proj ' + PJ.theme;
    el.innerHTML = `<div class="proj-vp" id="proj-vp"><div class="proj-content" id="proj-content"></div></div>
      <div class="proj-head" id="proj-head"></div>
      <div class="proj-remote" id="proj-remote"></div>
      <div class="proj-ctl" id="proj-ctl" role="toolbar" aria-label="שליטה במצב מקרן"></div>
      <div class="proj-count" id="proj-count" hidden></div>
      <div class="proj-toast" id="proj-toast"></div>
      <div class="proj-progress"><div id="proj-bar"></div></div>`;
    el.style.setProperty('--proj-fs', PJ.fs + 'px');
    el.hidden = false;
    document.body.classList.add('proj-open');
    PJ.fsOn = false;
    // Must run inside the click / key handler: browsers allow full screen only there.
    try { const d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().then(() => (PJ.fsOn = PJ.open)).catch(() => {}); } catch (e) { /* not allowed here */ }
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => (PJ.lock = l)).catch(() => {}); } catch (e) { /* unsupported */ }
    projRemoteBox();
    projCtl();
    projLoad(songId).then(() => {
      projActivity(15000);
      projPollLoop();
      if (S.prefs.projAuto) projStart();
    });
  }

  /** On-screen controls (mouse / touch). Shown on activity; while scrolling they fade out by themselves. */
  function projCtl() {
    const box = $('#proj-ctl');
    if (!box) return;
    const on = PJ.playing || PJ.counting > 0;
    const qi = S.queue.indexOf(PJ.songId);
    const many = qi >= 0 && S.queue.length > 1;
    box.innerHTML = `<button data-pj="exit" class="pj-exit" title="יציאה (Esc)" aria-label="יציאה ממצב מקרן">✕ יציאה</button>
      ${many ? `<button data-pj="prev" title="שיר קודם (PageUp)" aria-label="שיר קודם" ${qi > 0 ? '' : 'disabled'}>⏮</button>` : ''}
      <span class="pj-group"><button data-pj="speed-" title="לאט יותר (←)" aria-label="לאט יותר">−</button>
        <button data-pj="toggle" class="pj-play ${on ? 'on' : ''}" title="גלילה אוטומטית (רווח)" aria-pressed="${on}">${on ? '⏸ עצירה' : '▶ גלילה'} <small>${songDur(PJ.songId) ? '⏱ ' + fmtDur(songDur(PJ.songId)) : 'מהירות ' + projLevel()}</small></button>
        <button data-pj="speed+" title="מהר יותר (→)" aria-label="מהר יותר">+</button></span>
      ${many ? `<button data-pj="next" title="שיר הבא (PageDown)" aria-label="שיר הבא" ${qi < S.queue.length - 1 ? '' : 'disabled'}>⏭</button>` : ''}
      <span class="pj-group"><button data-pj="font-" title="הקטנת טקסט (−)" aria-label="הקטנת טקסט">A−</button><button data-pj="font+" title="הגדלת טקסט (+)" aria-label="הגדלת טקסט">A+</button></span>
      <button data-pj="lyrics" class="pj-mode ${PJ.mode === 'lyrics' ? 'on' : ''}" title="מילים בלבד / אקורדים + מילים (L)" aria-pressed="${PJ.mode === 'lyrics'}">${PJ.mode === 'lyrics' ? '🎤 מילים בלבד' : '🎸 אקורדים + מילים'}</button>
      <button data-pj="theme" title="צבעים (T)" aria-label="החלפת צבעים">${PJ.theme === 'black' ? '☀' : '🌙'}</button>`;
  }

  function closeProjector() {
    if (!PJ.open) return;
    PJ.open = false;
    PJ.fsOn = false;
    PJ.token++;
    projStop();
    clearTimeout(PJ.hideT);
    const el = $('#proj');
    el.hidden = true;
    el.innerHTML = '';
    document.body.classList.remove('proj-open');
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) { /* ignore */ }
    if (PJ.lock) { PJ.lock.release().catch(() => {}); PJ.lock = null; }
    if (S.route.view === 'song' && S.route.id !== PJ.songId) go('song', PJ.songId, { replace: true, force: true });
    else asRender();
  }

  async function projLoad(id) {
    let song = S.full.get(id);
    if (!song) {
      song = await call('apiGetSong', id, isOwner());
      S.full.set(id, song);
    }
    if (!PJ.open) return;
    PJ.songId = id;
    PJ.song = song;
    PJ.semis = song.Transpose || 0;
    PJ.y = 0;
    projRender(0);
  }

  /** Renders the current song keeping the relative scroll position (ratio 0..1). */
  function projRender(ratio) {
    const song = PJ.song;
    if (!song || !PJ.open) return;
    const key = baseKey(song);
    const capo = song.Capo > 0 ? song.Capo : 0;
    const qi = S.queue.indexOf(PJ.songId);
    $('#proj').style.setProperty('--proj-fs', PJ.fs + 'px');
    $('#proj-head').innerHTML = `<span class="ph-title">${esc(song.SongName)}</span>
      <span class="ph-artist">${esc((S.singerById.get(song.ArtistID) || {}).SingerName || '')}</span>
      ${key ? `<span class="ph-key">${esc(CE.transposeKey(key, PJ.semis))}</span>` : ''}${capo ? `<span class="ph-capo">קאפו ${capo}</span>` : ''}
      ${qi >= 0 && S.queue.length > 1 ? `<span class="ph-pos" dir="ltr">${qi + 1} / ${S.queue.length}</span>` : ''}`;
    projContent().innerHTML = PJ.mode === 'lyrics'
      ? `<div class="sheet lyrics-only" dir="${CE.isRtl(song.SongContent) ? 'rtl' : 'ltr'}">${lyricsHtml(song.SongContent)}</div>`
      : `<div class="sheet" dir="${CE.isRtl(song.SongContent) ? 'rtl' : 'ltr'}">${sheetHtml(song.SongContent, PJ.semis, 'smart', key)}</div>`;
    PJ.y = Math.round((ratio || 0) * projMax());
    projApplyY(false);
    projPublish();
  }

  function projApplyY(animate) {
    const c = projContent();
    if (!c) return;
    PJ.y = Math.max(0, Math.min(PJ.y, projMax()));
    c.classList.toggle('animate', !!animate);
    c.style.transform = `translate3d(0, ${-PJ.y}px, 0)`;
    const max = projMax();
    $('#proj-bar').style.width = (max ? (PJ.y / max) * 100 : 0) + '%';
  }

  /** Header and remote hint appear on activity and fade out after a few seconds. */
  function projActivity(ms) {
    if (!PJ.open) return;
    const el = $('#proj');
    el.classList.remove('idle');
    ['#proj-head', '#proj-remote', '#proj-ctl'].forEach((q) => $(q) && $(q).classList.add('show'));
    clearTimeout(PJ.hideT);
    PJ.hideT = setTimeout(projIdle, ms || 3000);
  }

  /** Hides the controls and the mouse pointer — only while scrolling, so a paused screen never looks stuck. */
  function projIdle() {
    if (!PJ.open) return;
    if (!(PJ.playing || PJ.counting > 0)) { PJ.hideT = setTimeout(projIdle, 3000); $('#proj-head').classList.remove('show'); return; }
    $('#proj').classList.add('idle');
    ['#proj-head', '#proj-remote', '#proj-ctl'].forEach((q) => $(q) && $(q).classList.remove('show'));
  }
  const projCtlShown = () => !!($('#proj-ctl') && $('#proj-ctl').classList.contains('show'));

  function projToast(text) {
    const t = $('#proj-toast');
    if (!t) return;
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(PJ.toastT);
    PJ.toastT = setTimeout(() => t.classList.remove('show'), 1000);
  }

  function projRemoteBox() {
    $('#proj-remote').innerHTML = `📱 שלט מהטלפון: באפליקציה ← <b>שלט למקרן</b> ← קוד <b class="ltr proj-code">${esc(PJ.code)}</b>`;
  }

  // ---- smooth auto-scroll (sub-pixel transform, no jitter)
  function projStart() {
    if (PJ.playing || PJ.counting) return;
    PJ.counting = Math.min(5, Math.max(3, S.prefs.projDelay || 3));
    const box = $('#proj-count');
    const tick = () => {
      if (!PJ.open) return;
      if (PJ.counting <= 0) {
        box.hidden = true;
        PJ.playing = true;
        PJ.last = 0;
        PJ.elapsed = songDur(PJ.songId) * (projMax() ? PJ.y / projMax() : 0);
        PJ.raf = requestAnimationFrame(projTick);
        projPublish();
        return;
      }
      box.hidden = false;
      box.textContent = PJ.counting;
      PJ.counting--;
      PJ.countT = setTimeout(tick, 1000);
    };
    tick();
    projPublish();
  }

  function projStop() {
    if (PJ.open && (PJ.playing || PJ.counting > 0)) setTimeout(projActivity, 0); // paused: controls come back
    clearTimeout(PJ.countT);
    cancelAnimationFrame(PJ.raf);
    PJ.playing = false;
    PJ.counting = 0;
    const box = $('#proj-count');
    if (box) box.hidden = true;
    projPublish();
  }

  const projToggle = () => (PJ.playing || PJ.counting ? projStop() : projStart());

  function projTick(ts) {
    if (!PJ.playing || !PJ.open) return;
    if (PJ.last) {
      const dt = (ts - PJ.last) / 1000;
      const dur = songDur(PJ.songId);
      if (dur) { PJ.elapsed = (PJ.elapsed || 0) + dt; PJ.y += dt * (Math.max(0, projMax() - PJ.y) / Math.max(0.5, dur - PJ.elapsed)); }
      else PJ.y += dt * PROJ_SPEEDS[projLevel() - 1] * (PJ.fs / 27);
      projApplyY(false);
      if (PJ.y >= projMax()) {
        projStop();
        const qi = S.queue.indexOf(PJ.songId);
        projToast(qi >= 0 && qi < S.queue.length - 1 ? 'סוף השיר 🎵 ⏭ לשיר הבא' : 'סוף השיר 🎵');
        projActivity();
        return;
      }
    }
    PJ.last = ts;
    PJ.raf = requestAnimationFrame(projTick);
  }

  function projSpeed(d) {
    const dur = songDur(PJ.songId);
    if (dur) { durNudge(PJ.songId, d); projToast('⏱ ' + fmtDur(songDur(PJ.songId))); projPublish(); return; }
    const lvl = Math.min(PROJ_SPEEDS.length, Math.max(1, projLevel() + d));
    store.set('pscroll.' + PJ.songId, lvl);
    projToast(`מהירות ${lvl}`);
    projPublish();
  }

  function projFont(d) {
    const ratio = projMax() ? PJ.y / projMax() : 0;
    const base = PJ.mode === 'lyrics' ? Math.min(80, Math.round(projDefaultFs() * 1.4)) : projDefaultFs();
    PJ.fs = d === 0 ? base : Math.min(projFsMax(), Math.max(16, PJ.fs + d * (PJ.mode === 'lyrics' ? 4 : 2)));
    store.set(PJ.mode === 'lyrics' ? 'projFsL' : 'projFs', PJ.fs);
    projRender(ratio);
    projToast(`פונט: ${projPct()}%`);
  }

  function projTranspose(d) {
    const ratio = projMax() ? PJ.y / projMax() : 0;
    PJ.semis = d === 0 ? (PJ.song.Transpose || 0) : Math.max(-11, Math.min(11, PJ.semis + d));
    projRender(ratio);
    const key = baseKey(PJ.song);
    projToast(key ? `סולם: ${CE.transposeKey(key, PJ.semis)}` : `סולם ${PJ.semis > 0 ? '+' : ''}${PJ.semis}`);
  }

  async function projStep(d) {
    const queue = S.queue.indexOf(PJ.songId) >= 0 ? S.queue : [PJ.songId];
    const next = queue[queue.indexOf(PJ.songId) + d];
    if (!next) { projToast(d > 0 ? 'זה השיר האחרון' : 'זה השיר הראשון'); return; }
    const wasPlaying = PJ.playing || PJ.counting > 0;
    projStop();
    await projLoad(next);
    projActivity();
    if (wasPlaying) projStart();
  }

  /** Full sheet (chords + lyrics, as before) <-> lyrics only. Keeps the place in the song. */
  function projLyrics() {
    const ratio = projMax() ? PJ.y / projMax() : 0;
    PJ.mode = PJ.mode === 'lyrics' ? 'full' : 'lyrics';
    store.set('projMode', PJ.mode);
    PJ.fs = projFsFor(PJ.mode);
    projRender(ratio);
    projToast(PJ.mode === 'lyrics' ? '🎤 מילים בלבד' : '🎸 אקורדים + מילים');
  }

  function projTheme() {
    PJ.theme = PJ.theme === 'black' ? 'cream' : 'black';
    store.set('projTheme', PJ.theme);
    $('#proj').className = 'proj ' + PJ.theme;
    projPublish();
  }

  function projManual(d) {
    PJ.y += d * projVp().clientHeight * 0.25;
    projApplyY(true);
  }

  /** One handler for keyboard, TV remote and the phone remote. */
  function projApply(type) {
    const map = {
      next: () => projStep(1), prev: () => projStep(-1), toggle: projToggle, play: projStart, pause: projStop,
      'speed+': () => projSpeed(1), 'speed-': () => projSpeed(-1), 'font+': () => projFont(1), 'font-': () => projFont(-1),
      font0: () => projFont(0), 'tr+': () => projTranspose(1), 'tr-': () => projTranspose(-1), tr0: () => projTranspose(0),
      theme: projTheme, top: () => { PJ.y = 0; projApplyY(true); }, lyrics: projLyrics,
    };
    if (map[type]) { map[type](); projActivity(); }
  }

  /** What the phone remote shows (debounced). */
  function projPublish() {
    if (PJ.open) projCtl();
    if (!PJ.open || !PJ.code) return;
    clearTimeout(PJ.pubT);
    PJ.pubT = setTimeout(() => {
      const song = PJ.song || {};
      const key = song.SongContent ? baseKey(song) : '';
      call('apiProjSetState', PJ.code, {
        song: song.SongName || '', key: key ? CE.transposeKey(key, PJ.semis) : '', semis: PJ.semis, playing: PJ.playing || PJ.counting > 0,
        level: projLevel(), font: projPct(), theme: PJ.theme, mode: PJ.mode, pos: S.queue.indexOf(PJ.songId) + 1, total: S.queue.length,
      }).catch(() => {});
    }, 250);
  }

  /** Long-polls the server for phone commands while the projector is open. */
  async function projPollLoop() {
    const token = ++PJ.token;
    try {
      const r = await call('apiProjOpen', PJ.code);
      PJ.seq = r.seq; // ignore commands sent before this screen opened
    } catch (e) {
      $('#proj-remote').textContent = 'השלט מהטלפון לא זמין כרגע (' + e.message + ')';
      return;
    }
    projPublish();
    while (PJ.open && token === PJ.token) {
      try {
        const r = await call('apiProjPoll', PJ.code, PJ.seq, 20000);
        if (!PJ.open || token !== PJ.token) return;
        PJ.seq = r.seq;
        r.cmds.forEach((c) => projApply(c.type));
      } catch (e) {
        await new Promise((res) => setTimeout(res, 3000));
      }
    }
  }

  // Keyboard / TV remote. Registered in the capture phase so it wins over the other shortcuts.
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
    const k = e.key;
    if (!PJ.open) {
      if ((k === 'f' || k === 'F' || k === 'p' || k === 'P') && !typing && !$('#modal-root').firstElementChild && S.sv && (S.route.view === 'song' || !$('#perf').hidden)) {
        e.preventDefault();
        e.stopImmediatePropagation();
        openProjector(S.sv.id);
      }
      return;
    }
    const keys = {
      Escape: closeProjector, f: closeProjector, F: closeProjector, p: closeProjector, P: closeProjector,
      ' ': projToggle, ArrowDown: () => projManual(1), ArrowUp: () => projManual(-1),
      '+': () => projFont(1), '=': () => projFont(1), '-': () => projFont(-1), 0: () => projFont(0), '0': () => projFont(0),
      PageDown: () => projStep(1), PageUp: () => projStep(-1), ArrowLeft: () => projSpeed(-1), ArrowRight: () => projSpeed(1),
      t: projTheme, T: projTheme, l: projLyrics, L: projLyrics,
    };
    if (!keys[k]) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    keys[k]();
    projActivity();
  }, true);
  document.addEventListener('mousemove', () => PJ.open && projActivity());
  document.addEventListener('click', (e) => {
    if (!PJ.open || !e.target.closest('#proj')) return;
    e.stopPropagation();
    const b = e.target.closest('[data-pj]');
    if (b) {
      if (b.disabled) return;
      if (b.dataset.pj === 'exit') closeProjector();
      else projApply(b.dataset.pj);
      return;
    }
    // Tap / click on the song: first shows the controls, then starts / pauses scrolling.
    if (!projCtlShown()) projActivity();
    else { projToggle(); projActivity(); }
  }, true);
  // Esc in full screen is taken by the browser (it only leaves full screen): treat that as "exit projector".
  document.addEventListener('fullscreenchange', () => {
    if (!PJ.open) return;
    if (document.fullscreenElement) PJ.fsOn = true;
    else if (PJ.fsOn) closeProjector();
  });
  document.addEventListener('wheel', (e) => { if (PJ.open) { PJ.y += e.deltaY; projApplyY(false); projActivity(); } }, { passive: true });
  let projTouchY = null;
  document.addEventListener('touchstart', (e) => { if (PJ.open) projTouchY = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!PJ.open || projTouchY === null) return;
    PJ.y += projTouchY - e.touches[0].clientY;
    projTouchY = e.touches[0].clientY;
    projApplyY(false);
  }, { passive: true });

  // ================================================================ phone remote for the projector

  let rcTimer = 0;
  function viewRemote() {
    const code = S.remoteCode || store.get('remoteCode', '');
    const b = (cmd, label, cls) => `<button class="rc-btn ${cls || ''}" data-act="rc" data-cmd="${cmd}">${label}</button>`;
    V().innerHTML = `<div class="page-head"><div><h1>📱 שלט למקרן</h1><div class="muted">שליטה מהטלפון על מה שמוצג בטלוויזיה / במקרן</div></div></div>
      <div class="panel rc">
        <div class="rc-connect"><input id="rc-code" class="ltr rc-code" maxlength="5" autocomplete="off" value="${esc(code)}" placeholder="קוד מהמסך">
          <button class="btn btn-accent" data-act="rc-connect">התחברות</button></div>
        <div class="rc-status muted" id="rc-status">${code ? 'מתחבר…' : 'הקוד מופיע בפינת מסך המקרן'}</div>
        <div class="rc-grid">
          ${b('prev', '⏮<small>שיר קודם</small>')}${b('toggle', '▶ ❚❚<small>גלילה</small>', 'rc-main')}${b('next', '⏭<small>שיר הבא</small>')}
          ${b('speed-', '−<small>מהירות</small>')}<div class="rc-val" id="rc-speed">—</div>${b('speed+', '+<small>מהירות</small>')}
          ${b('font-', 'A−<small>פונט</small>')}<div class="rc-val" id="rc-font">—</div>${b('font+', 'A+<small>פונט</small>')}
          ${b('tr-', '♭<small>סולם</small>')}<div class="rc-val" id="rc-key">—</div>${b('tr+', '♯<small>סולם</small>')}
          ${b('top', '⤒<small>לראש השיר</small>')}${b('font0', '100%<small>איפוס פונט</small>')}${b('theme', '◐<small>צבעים</small>')}
          ${b('lyrics', '🎤<small>מילים בלבד / מלא</small>', 'rc-wide')}
        </div>
      </div>`;
    clearInterval(rcTimer);
    rcTimer = setInterval(() => (S.route.view === 'remote' && !document.hidden ? rcRefresh() : S.route.view !== 'remote' && clearInterval(rcTimer)), 2500);
    if (code) rcRefresh();
  }

  function rcShow(res) {
    const st = $('#rc-status');
    if (!st) return;
    if (!res || !res.connected) { st.textContent = 'לא נמצא מסך עם הקוד הזה — פתח "מצב מקרן" בטלוויזיה ובדוק את הקוד'; st.className = 'rc-status hint warn'; return; }
    const s = res.state || {};
    st.className = 'rc-status hint ok';
    st.textContent = `✓ מחובר${s.song ? ' · ' + s.song : ''}${s.total > 1 ? ` (${s.pos}/${s.total})` : ''}${s.playing ? ' · ▶ גולל' : ''}${s.mode === 'lyrics' ? ' · 🎤 מילים בלבד' : ''}`;
    $('#rc-speed').textContent = s.level ? `מהירות ${s.level}` : '—';
    $('#rc-font').textContent = s.font ? `${s.font}%` : '—';
    $('#rc-key').textContent = s.key || (s.semis ? (s.semis > 0 ? '+' : '') + s.semis : '—');
  }

  async function rcRefresh() {
    const code = S.remoteCode || store.get('remoteCode', '');
    if (!code) return;
    try { rcShow(await call('apiProjGetState', code)); } catch (e) { rcShow(null); }
  }

  // ================================================================ playlists

  function viewPlaylists() {
    const pls = S.lib.playlists || [];
    V().innerHTML = `<div class="page-head"><div><h1>פלייליסטים</h1><div class="muted">${pls.length} רשימות</div></div><span class="spacer"></span>
      <button class="btn btn-accent owner-only" data-act="new-pl">${icon('plus')} פלייליסט חדש</button></div>
      ${pls.length ? `<div class="grid">${pls.map((p) => `<article class="card pl-card" data-act="open-pl" data-id="${esc(p.PlaylistID)}">
          <div class="avatar pl-avatar">${icon('list')}</div>
          <div class="meta"><div class="title">${esc(p.PlaylistName)}</div>
            <div class="sub">${p.songs.length} שירים${p.Description ? ' · ' + esc(p.Description) : ''}</div></div></article>`).join('')}</div>`
        : `<div class="empty">עדיין אין פלייליסטים<br><button class="btn btn-accent owner-only" data-act="new-pl">${icon('plus')} פלייליסט חדש</button></div>`}`;
  }

  /** Singer chosen inside a playlist ('' = all), remembered per playlist for this visit. */
  const plSinger = (id) => (S.plSinger && S.plSinger.id === id ? S.plSinger.singer : '');

  /** Songs of a playlist as shown now (singer filter applied), in playlist order. */
  function plShown(pl) {
    const songs = pl.songs.map((sid) => S.songs.find((x) => x.SongID === sid)).filter(Boolean);
    const who = plSinger(pl.PlaylistID);
    return who ? songs.filter((x) => x.ArtistID === who) : songs;
  }

  /** Play order = what is on screen: one singer, or (grouped view) singer after singer. */
  function plQueue(pl) {
    const shown = plShown(pl);
    if (plSinger(pl.PlaylistID) || S.prefs.plView === 'order') return shown.map((x) => x.SongID);
    const order = [];
    shown.forEach((x) => { if (order.indexOf(x.ArtistID) < 0) order.push(x.ArtistID); });
    const n = (aid) => shown.filter((x) => x.ArtistID === aid).length;
    const name = (aid) => (S.singerById.get(aid) || {}).SingerName || '';
    order.sort((a, b) => n(b) - n(a) || name(a).localeCompare(name(b), 'he'));
    return order.reduce((acc, aid) => acc.concat(shown.filter((x) => x.ArtistID === aid).map((x) => x.SongID)), []);
  }

  function viewPlaylist(id) {
    const pl = (S.lib.playlists || []).find((p) => p.PlaylistID === id);
    if (!pl) { V().innerHTML = '<div class="empty">הפלייליסט לא נמצא.</div>'; return; }
    const all = pl.songs.map((sid) => S.songs.find((x) => x.SongID === sid)).filter(Boolean);
    // Singers in this playlist, most songs first.
    const counts = new Map();
    all.forEach((x) => counts.set(x.ArtistID, (counts.get(x.ArtistID) || 0) + 1));
    const singers = Array.from(counts.keys()).map((aid) => ({ id: aid, name: (S.singerById.get(aid) || {}).SingerName || '—', n: counts.get(aid) }))
      .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'he'));
    let who = plSinger(id);
    if (who && !counts.has(who)) { who = ''; S.plSinger = null; }
    const songs = plShown(pl);
    const grouped = !who && singers.length > 1 && S.prefs.plView !== 'order';
    const whoName = who ? singers.find((a) => a.id === who).name : '';

    // Groups of rows; ▲▼ swap a song with its neighbour inside the same group.
    const groups = grouped
      ? singers.map((a) => ({ singer: a, songs: songs.filter((x) => x.ArtistID === a.id) }))
      : [{ singer: null, songs }];
    const row = (x, list, i) => `<div class="pl-row">${songCard(x)}
          <div class="pl-ctl owner-only"><button class="icon-btn" data-act="pl-move" data-id="${esc(id)}" data-song="${esc(x.SongID)}" data-swap="${esc(i ? list[i - 1].SongID : '')}" ${i ? '' : 'disabled'} aria-label="למעלה">▲</button>
          <button class="icon-btn" data-act="pl-move" data-id="${esc(id)}" data-song="${esc(x.SongID)}" data-swap="${esc(i < list.length - 1 ? list[i + 1].SongID : '')}" ${i < list.length - 1 ? '' : 'disabled'} aria-label="למטה">▼</button>
          <button class="icon-btn" data-act="pl-remove" data-id="${esc(id)}" data-song="${esc(x.SongID)}" aria-label="הסרה מהפלייליסט">✕</button></div></div>`;
    const body = groups.map((g) => `${g.singer ? `<div class="pl-group"><button class="pl-group-h" data-act="pl-singer" data-id="${esc(id)}" data-singer="${esc(g.singer.id)}" title="להציג רק את ${esc(g.singer.name)}">
        ${avatar(g.singer.name, (S.singerById.get(g.singer.id) || {}).ImageURL, true)}<span class="nm">${esc(g.singer.name)}</span><span class="muted">${g.singer.n} שירים</span></button></div>` : ''}
      <div class="grid pl-list">${g.songs.map((x, i) => row(x, g.songs, i)).join('')}</div>`).join('');

    const playLabel = who ? `נגן את ${esc(whoName)} (${songs.length})` : 'נגן הכול';
    V().innerHTML = `<div class="page-head"><div><h1>${esc(pl.PlaylistName)}</h1>
        <div class="muted">${all.length} שירים · ${singers.length} זמרים${pl.Description ? ' · ' + esc(pl.Description) : ''}</div></div><span class="spacer"></span>
        ${songs.length ? `<button class="btn btn-accent" data-act="pl-play" data-id="${esc(id)}">${icon('play')} ${playLabel}</button>
          <button class="btn" data-act="pl-proj" data-id="${esc(id)}">📽 הקרנה</button>` : ''}
        <button class="btn btn-sm" data-act="share" data-view="playlist" data-id="${esc(id)}" data-title="${esc(pl.PlaylistName)}">🔗 קישור</button>
        <button class="btn btn-sm owner-only" data-act="edit-pl" data-id="${esc(id)}">${icon('edit')} שינוי שם</button>
        <button class="btn btn-sm btn-danger owner-only" data-act="delete-pl" data-id="${esc(id)}">${icon('trash')} מחיקה</button></div>
      ${singers.length > 1 ? `<div class="pl-singers" role="tablist" aria-label="בחירת זמר">
          <button class="pl-sg ${who ? '' : 'on'}" role="tab" aria-selected="${!who}" data-act="pl-singer" data-id="${esc(id)}" data-singer="">הכל <span class="n">${all.length}</span></button>
          ${singers.map((a) => `<button class="pl-sg ${who === a.id ? 'on' : ''}" role="tab" aria-selected="${who === a.id}" data-act="pl-singer" data-id="${esc(id)}" data-singer="${esc(a.id)}">${esc(a.name)} <span class="n">${a.n}</span></button>`).join('')}
        </div>
        ${who ? '' : `<div class="pl-viewmode"><button class="btn btn-sm ${grouped ? 'btn-accent' : ''}" data-act="pl-view" data-v="group">👥 לפי זמר</button>
          <button class="btn btn-sm ${grouped ? '' : 'btn-accent'}" data-act="pl-view" data-v="order">☰ לפי הסדר</button></div>`}` : ''}
      ${songs.length ? body : '<div class="empty">אין עדיין שירים בפלייליסט.<br>פתח שיר ← "פלייליסטים" כדי להוסיף אותו.</div>'}`;
  }

  async function playlistModal(pl) {
    const r = await modal({
      title: pl ? 'שינוי שם הפלייליסט' : 'פלייליסט חדש',
      html: `<div class="fields" style="margin-bottom:16px">
        <div class="field wide"><label for="m-pl-name">שם</label><input id="m-pl-name" maxlength="80" value="${esc(pl ? pl.PlaylistName : '')}" placeholder="למשל: מזרחית, לועזי, ערב שירים"></div>
        <div class="field wide"><label for="m-pl-desc">תיאור (לא חובה)</label><input id="m-pl-desc" maxlength="300" value="${esc(pl ? pl.Description : '')}"></div></div>`,
      buttons: [{ label: 'שמירה', value: 'save', cls: 'btn-accent' }, { label: 'ביטול', value: null }],
      collect: (root) => ({ PlaylistName: root.querySelector('#m-pl-name').value.trim(), Description: root.querySelector('#m-pl-desc').value.trim() }),
    });
    if (r.value !== 'save' || !r.data.PlaylistName) return null;
    try {
      const res = await call('apiSavePlaylist', Object.assign({ PlaylistID: pl ? pl.PlaylistID : '' }, r.data));
      if (pl) Object.assign(pl, r.data);
      else S.lib.playlists.push({ PlaylistID: res.PlaylistID, PlaylistName: res.PlaylistName, Description: r.data.Description, songs: [] });
      toast('הפלייליסט נשמר ✓', 'ok');
      return res;
    } catch (e) { fail(e); return null; }
  }

  /** Choose the playlists a song belongs to (any number), or create a new one on the spot. */
  async function songPlaylistsModal(songId) {
    const pls = S.lib.playlists || [];
    const r = await modal({
      title: 'פלייליסטים לשיר',
      html: `<div class="pl-pick">${pls.map((p) => `<label class="chip-toggle"><input type="checkbox" value="${esc(p.PlaylistID)}" ${p.songs.indexOf(songId) >= 0 ? 'checked' : ''}> ${esc(p.PlaylistName)}</label>`).join('') || '<div class="muted">אין עדיין פלייליסטים</div>'}</div>
        <div class="field" style="margin:12px 0 16px"><label for="m-new-pl">פלייליסט חדש (לא חובה)</label><input id="m-new-pl" maxlength="80" placeholder="שם לפלייליסט חדש"></div>`,
      buttons: [{ label: 'שמירה', value: 'save', cls: 'btn-accent' }, { label: 'ביטול', value: null }],
      collect: (root) => ({ ids: $$('.pl-pick input:checked', root).map((i) => i.value), name: root.querySelector('#m-new-pl').value.trim() }),
    });
    if (r.value !== 'save') return;
    const before = S.lib.playlists.map((p) => [p, p.songs.slice()]);
    try {
      const ids = r.data.ids.slice();
      if (r.data.name) {
        const created = await call('apiSavePlaylist', { PlaylistName: r.data.name, Description: '' });
        S.lib.playlists.push({ PlaylistID: created.PlaylistID, PlaylistName: created.PlaylistName, Description: '', songs: [] });
        ids.push(created.PlaylistID);
      }
      // Shown at once; the sheet is updated in the background (undone if that fails).
      S.lib.playlists.forEach((p) => {
        const has = p.songs.indexOf(songId) >= 0;
        if (ids.indexOf(p.PlaylistID) >= 0 && !has) p.songs.push(songId);
        if (ids.indexOf(p.PlaylistID) < 0 && has) p.songs.splice(p.songs.indexOf(songId), 1);
      });
      toast('הפלייליסטים עודכנו ✓', 'ok');
      render();
      await call('apiSetSongPlaylists', songId, ids);
    } catch (e) {
      before.forEach(([p, songs]) => (p.songs = songs));
      fail(e);
      render();
    }
  }

  /** Adds many songs at once (e.g. all of a singer's songs) to the chosen playlists. Existing links stay. */
  async function manyToPlaylistsModal(songIds, title, singerOrList) {
    const pls = S.lib.playlists || [];
    const singers = singerOrList ? [].concat(singerOrList) : [];
    const singer = singers.length ? singers[0] : null;
    const whoFuture = singers.length === 1 ? 'ל' + singers[0].SingerName : `ל-${singers.length} הזמרים`;
    // Already complete (and, for singers, already linked): nothing left to do there.
    const inAll = (p) => songIds.every((sid) => p.songs.indexOf(sid) >= 0) && singers.every((a) => autoIds(a).indexOf(p.PlaylistID) >= 0);
    const r = await modal({
      title,
      html: `<div class="muted" style="margin-bottom:10px">${songIds.length} שירים ייכנסו לפלייליסטים שתסמן (שירים שכבר שם לא יוכפלו).</div>
        <div class="pl-pick">${pls.map((p) => `<label class="chip-toggle"><input type="checkbox" value="${esc(p.PlaylistID)}" ${inAll(p) ? 'checked disabled' : ''}> ${esc(p.PlaylistName)}</label>`).join('') || '<div class="muted">אין עדיין פלייליסטים</div>'}</div>
        <div class="field" style="margin:12px 0 ${singer ? 8 : 16}px"><label for="m-new-pl">פלייליסט חדש (לא חובה)</label><input id="m-new-pl" maxlength="80" placeholder="שם לפלייליסט חדש"></div>
        ${singer ? `<label class="chip-toggle auto-link" style="margin-bottom:16px"><input type="checkbox" id="m-auto" checked> 🔗 גם שירים שיתווספו ${esc(whoFuture)} בעתיד ייכנסו אוטומטית</label>` : ''}`,
      buttons: [{ label: 'הוספה', value: 'save', cls: 'btn-accent' }, { label: 'ביטול', value: null }],
      collect: (root) => ({ ids: $$('.pl-pick input:checked:not(:disabled)', root).map((i) => i.value), name: root.querySelector('#m-new-pl').value.trim(),
        auto: !!(root.querySelector('#m-auto') && root.querySelector('#m-auto').checked) }),
    });
    if (r.value !== 'save' || (!r.data.ids.length && !r.data.name)) return;
    const link = !!(singer && r.data.auto);
    const prevAuto = singers.map((a) => [a, a.AutoPlaylists]);
    const before = S.lib.playlists.map((p) => [p, p.songs.slice()]);
    try {
      const ids = r.data.ids.slice();
      if (r.data.name) {
        const created = await call('apiSavePlaylist', { PlaylistName: r.data.name, Description: '' });
        S.lib.playlists.push({ PlaylistID: created.PlaylistID, PlaylistName: created.PlaylistName, Description: '', songs: [] });
        ids.push(created.PlaylistID);
      }
      let added = 0;
      S.lib.playlists.filter((p) => ids.indexOf(p.PlaylistID) >= 0).forEach((p) => {
        songIds.forEach((sid) => { if (p.songs.indexOf(sid) < 0) { p.songs.push(sid); added++; } });
      });
      if (link) singers.forEach((a) => (a.AutoPlaylists = autoIds(a).concat(ids.filter((pid) => autoIds(a).indexOf(pid) < 0)).join(' ')));
      toast((added ? `נוספו ${added} שירים ✓` : 'כל השירים כבר נמצאים שם') + (link ? ' · שירים חדשים ייכנסו אוטומטית' : ''), 'ok');
      render();
      const res = await call('apiAddSongsToPlaylists', songIds, ids, link ? { linkSingerIds: singers.map((a) => a.SingerID) } : {});
      ((res && res.singers) || []).forEach((x) => { const a = S.singerById.get(x.SingerID); if (a) Object.assign(a, x); });
      return true;
    } catch (e) {
      before.forEach(([p, songs]) => (p.songs = songs));
      prevAuto.forEach(([a, v]) => (a.AutoPlaylists = v));
      fail(e);
      render();
    }
  }

  /** Playlists a singer is linked to (their new songs join them automatically); deleted ones are skipped. */
  function autoIds(singer) {
    const known = (S.lib.playlists || []).map((p) => p.PlaylistID);
    return String((singer && singer.AutoPlaylists) || '').split(/[ ,]+/).filter((pid) => pid && known.indexOf(pid) >= 0);
  }

  // ================================================================ chord library (separate module, loaded on first use)

  async function loadLab() {
    if (window.ChordLabFactory) return;
    let src = store.get('cache.lab', null);
    if (!src || src.v !== LOCAL_BUILD || !src.js) {
      src = await call('apiChordLab');
      localPut('cache.lab', src);
    }
    const st = document.createElement('style');
    st.id = 'cl-style';
    st.textContent = src.css;
    document.head.appendChild(st);
    const sc = document.createElement('script');
    sc.textContent = src.js;
    document.head.appendChild(sc);
    if (!window.ChordLabFactory) throw new Error('ספריית האקורדים לא נטענה. רענן את הדף ונסה שוב.');
  }

  async function viewChords(chord) {
    V().innerHTML = loading();
    await loadLab();
    if (S.route.view !== 'chords') return;
    if (!S.lab) S.lab = window.ChordLabFactory({ CE, esc, store, songs: () => S.songs.filter((x) => listed(x) || isOwner()) });
    // Coming from a song: its chords (as shown there) become a row to step through.
    const from = S.labFrom && S.labFrom.chord === chord ? S.labFrom : null;
    S.lab.mount(V(), { chord: chord || '', songChords: from ? from.chords : [], songName: from ? from.name : '' });
  }

  async function exportBackup() {
    try {
      const b = await call('apiExportBackup');
      const json = JSON.stringify(b, null, 2);
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = b.fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      $('#backup-out').innerHTML = `<div class="muted" style="margin-top:10px">נוצר הקובץ <b class="ltr">${esc(b.fileName)}</b> (${b.counts.Songs} שירים, ${b.counts.Singers} זמרים). אם ההורדה לא התחילה, העתק את התוכן:</div>
        <textarea class="backup-json mono ltr" readonly>${esc(json)}</textarea>`;
      toast('הגיבוי נוצר ✓', 'ok');
    } catch (e) {
      fail(e);
    }
  }

  async function importBackup(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const n = data && data.data && data.data.Songs ? data.data.Songs.length : 0;
      if (!(await confirmBox('שחזור מגיבוי', `הקובץ מכיל ${n} שירים. רשומות שכבר קיימות יישארו כפי שהן; רק רשומות חסרות יתווספו.`, 'שחזור'))) return;
      const summary = await call('apiImportBackup', data);
      loadLibrary(await call('apiBootstrap'));
      S.full.clear();
      toast(`שוחזרו ${summary.Songs.added} שירים ו-${summary.Singers.added} זמרים`, 'ok');
      render();
    } catch (err) {
      fail(err instanceof SyntaxError ? new Error('הקובץ אינו JSON תקין') : err);
    }
  }

  function applyTheme() {
    document.documentElement.dataset.theme = S.prefs.theme;
    document.documentElement.style.setProperty('--fs', S.prefs.font + 'px');
  }

      try {
        const v = await call('apiVisits');
        const when = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }); };
        const who = (x) => (x.name ? esc(x.name) : `<span class="muted">מבקר ${esc(String(x.id).slice(-4))}</span>`);
        const EV = { open: '🚪 נכנס', name: '👋 שם', song: '🎵 שיר', playlist: '📋 פלייליסט', singer: '🎤 זמר', perf: '▶ מצב נגינה', projector: '📽 מקרן', chords: '🎸 ספריית אקורדים', view: '📄 מסך' };
        box.innerHTML = !v.visitors.length ? '<div class="empty">עדיין אין ביקורים.</div>' : `
          <h3 style="margin:14px 0 6px">${v.visitors.length === 1 ? 'מבקר אחד' : v.visitors.length + ' מבקרים'}</h3>
          <div class="vis-list">${v.visitors.map((x) => `<div class="vis-card"><div class="vis-h"><b>${who(x)}</b><span class="muted">${esc(x.device)}</span></div>
            <div class="muted" style="font-size:12px">ביקור אחרון ${esc(when(x.last))} · ${x.visits === 1 ? 'ביקור אחד' : x.visits + ' ביקורים'} · מאז ${esc(when(x.first))}</div>
            ${x.songs.length ? `<div class="vis-songs">${x.songs.map((t) => `<span class="badge">${esc(t)}</span>`).join('')}</div>` : ''}</div>`).join('')}</div>
          ${v.topSongs.length ? `<h3 style="margin:14px 0 6px">השירים שנצפו הכי הרבה</h3><div class="vis-songs">${v.topSongs.map((t) => `<span class="badge">${esc(t.song)} · ${t.count}</span>`).join('')}</div>` : ''}
          <h3 style="margin:14px 0 6px">פעילות אחרונה</h3>
          <div class="vis-events">${v.events.slice(0, 120).map((e) => `<div><span class="muted">${esc(when(e.time))}</span> · ${who(e)} · ${EV[e.ev] || esc(e.ev)}${e.detail ? ': ' + esc(e.detail) : ''}</div>`).join('')}</div>`;
      } catch (e) { box.innerHTML = ''; fail(e); }
      el.disabled = false;
    },
    'pref-projdelay': (el) => { S.prefs.projDelay = +el.dataset.v; savePrefs(); render(); },
    'pref-projauto': (el) => { S.prefs.projAuto = el.checked; savePrefs(); },
    'drive-now': async (el) => {
      el.disabled = true;
      try {
        const b = await call('apiDriveBackupNow');
        if (b.status !== 'ok') throw new Error(b.message || 'הגיבוי נכשל');
        S.lib.backup = b.state;
        toast(`נשמר בדרייב: ${b.file}`, 'ok');
        render();
      } catch (e) { el.disabled = false; fail(e); }
    },
    'drive-list': async () => {
      const box = $('#drive-list');
      box.innerHTML = loading();
      try {
        const list = await call('apiListDriveBackups');
        box.innerHTML = list.length
          ? `<div class="del-list">${list.map((f) => `<div class="row del-item"><div class="ltr" style="font-size:13px">${esc(f.name)} <span class="muted">· ${esc(new Date(f.updated).toLocaleString('he-IL'))} · ${Math.max(1, Math.round(f.size / 1024))}KB</span></div><span class="spacer"></span>
              <button class="btn btn-sm" data-act="drive-restore" data-id="${esc(f.id)}">שחזור</button></div>`).join('')}</div>`
          : '<div class="muted" style="margin-top:8px">אין עדיין גיבויים בתיקייה.</div>';
      } catch (e) { box.innerHTML = ''; fail(e); }
    },
    'drive-restore': async (el) => {
      if (!(await confirmBox('שחזור מגיבוי בדרייב', 'רק שירים וזמרים שחסרים יתווספו. שום דבר קיים לא יידרס או יימחק.', 'שחזור'))) return;
      el.disabled = true;
      try {
        const summary = await call('apiRestoreDriveBackup', el.dataset.id);
        loadLibrary(await call('apiBootstrap'));
        S.full.clear();
        toast(`שוחזרו ${summary.Songs.added} שירים ו-${summary.Singers.added} זמרים`, 'ok');
        render();
      } catch (e) { el.disabled = false; fail(e); }
    },
    'list-deleted': async () => {
      const box = $('#deleted-list');
      box.innerHTML = loading();
      try {
        const list = await call('apiListDeleted');
        box.innerHTML = list.length
          ? `<div class="del-list">${list.map((d) => `<div class="row del-item"><div><b>${esc(d.SongName)}</b> <span class="muted">— ${esc(d.ArtistName)} · נמחק ${esc(fmtDate(d.at))}</span></div><span class="spacer"></span>
              <button class="btn btn-sm btn-accent" data-act="restore-deleted" data-row="${d.row}">שחזור</button></div>`).join('')}</div>`
          : '<div class="muted" style="margin-top:8px">אין שירים שנמחקו.</div>';
      } catch (e) { box.innerHTML = ''; fail(e); }
    },
    'restore-deleted': async (el) => {
      el.disabled = true;
      try {
        const res = await call('apiRestoreDeleted', +el.dataset.row);
        upsert(S.singers, 'SingerID', res.singer);
        reindex();
        S.full.set(res.song.SongID, res.song);
        applySongMeta(res.song);
        toast(`"${res.song.SongName}" שוחזר ✓`, 'ok');
        ACTIONS['list-deleted']();
      } catch (e) { el.disabled = false; fail(e); }
    },
    snapshot: async () => {
      try {
        const made = await call('apiSnapshot');
        toast(made.length ? `נוצרו לשוניות גיבוי: ${made.join(', ')}` : 'אין עדיין נתונים לגבות', 'ok');
      } catch (e) { fail(e); }
    },
    reload: async () => {
      try { loadLibrary(await call('apiBootstrap')); S.full.clear(); toast('הנתונים רועננו', 'ok'); render(); } catch (e) { fail(e); }
    },
  };

  // Chord fingering popup: hover on desktop, tap on touch screens.
  document.addEventListener('pointerover', (e) => {
    if (e.pointerType !== 'mouse') return; // touch: handled by tap (click) only
    const el = e.target.closest && e.target.closest('[data-chord]');
    if (el && el !== popFor) showChordPop(el);
    else if (!el && popFor && !(e.target.closest && e.target.closest('#chord-pop'))) hideChordPop(120);
  });
  document.addEventListener('click', (e) => {
    const chordEl = e.target.closest('[data-chord]');
    if (chordEl) {
      // A tap fires mouseover (opens) then click: only a later click on the same chord closes it.
      const open = popFor === chordEl && !$('#chord-pop').hidden;
      if (open && Date.now() - popShownAt > 400) hideChordPop();
      else if (!open) showChordPop(chordEl);
      return;
    }
    if (popFor && !e.target.closest('#chord-pop')) hideChordPop();
  }, true);
  window.addEventListener('scroll', () => { if (popFor && !AS.on && Date.now() - popShownAt > 400) hideChordPop(); }, true);
  document.addEventListener('toggle', (e) => { if (e.target.classList && e.target.classList.contains('sv-diagrams')) store.set('diagramsOpen', e.target.open); }, true);

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-fav],[data-fav-singer],[data-act],[data-nav],[data-open-song],[data-open-singer]');
    if (!el || el.disabled) return;
    const d = el.dataset;
    if (d.fav) { e.stopPropagation(); toggleFav(d.fav); }
    else if (d.favSinger) { e.stopPropagation(); toggleSingerFav(d.favSinger); }
    else if (d.act && ACTIONS[d.act]) { if (el.tagName !== 'INPUT') e.preventDefault(); ACTIONS[d.act](el, e); }
    else if (d.nav) go(d.nav);
    else if (d.openSong) {
      const grid = el.closest('.grid');
      S.queue = grid ? $$('[data-open-song]', grid).map((c) => c.dataset.openSong) : [d.openSong];
      S.autoPerf = isPhone() && S.prefs.phonePerf !== false;
      go('song', d.openSong);
    }
    else if (d.openSinger) go('singer', d.openSinger);
  });

  document.addEventListener('change', (e) => {
    const k = e.target.dataset && e.target.dataset.filter;
    if (!k) return;
    S.filters[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    saveFilters();
    renderResults();
  });

  $('#global-search').addEventListener('input', (e) => {
    S.filters.q = e.target.value;
    if (S.route.view !== 'songs' && S.route.view !== 'favorites') go('songs');
    else renderResults();
  });

  document.addEventListener('keydown', (e) => {
    const perfOpen = !$('#perf').hidden;
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
    if ((perfOpen || S.route.view === 'song') && !typing && !$('#modal-root').firstElementChild) {
      const page = () => (asTarget() || document.documentElement).clientHeight * 0.8;
      if (e.key === ' ') { e.preventDefault(); asToggle(); return; }
      // Page-turner pedals send PageDown/PageUp or arrow keys.
      if (e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); asHold(1500); asScrollBy(page()); return; }
      if (e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); asHold(1500); asScrollBy(-page()); return; }
    }
    if (perfOpen) {
      if (e.key === 'Escape') stopPerf();
      else if (e.key === '+' || e.key === '=') changeFont(1);
      else if (e.key === '-') changeFont(-1);
      return;
    }
    if (e.key === '/' && !typing) { e.preventDefault(); $('#global-search').focus(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's' && (S.route.view === 'add' || S.route.view === 'edit')) { e.preventDefault(); saveSong(); }
  });

  window.addEventListener('beforeunload', (e) => {
    if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  // ================================================================ boot

  /**
   * Code.gs (server + chord engine) and Index.html (this page) must come from the same version.
   * A partial update otherwise breaks the app with cryptic errors, so stop with clear guidance.
   */
  function checkBuild(serverVersion, deployedIndex) {
    const page = document.body.dataset.build;
    const needed = ['songStructure', 'chordShape', 'realignProportional', 'parseSong', 'suggestCapo'];
    const missing = needed.filter((f) => typeof CE[f] !== 'function');
    if (page === serverVersion && !missing.length) return;
    let how;
    if (deployedIndex && deployedIndex === serverVersion) {
      // The project files match; this browser shows an older copy of the page.
      how = 'הקבצים בפרויקט תקינים, אבל הדפדפן מציג עותק ישן של הדף. סגור את הלשונית/האפליקציה לגמרי ופתח שוב את הקישור (מ-Deploy ← Manage deployments ← Web app URL). אם נשמר קיצור דרך במסך הבית — מחק אותו וצור מחדש.';
    } else {
      how = `קובץ Index.html שפרוס עכשיו הוא גרסה ${deployedIndex || page || 'ישנה'}. ודא שהתוכן הודבק ונשמר (💾), ואז Deploy ← Manage deployments ← ✏️ ← New version.`;
    }
    throw new Error(`הקבצים אינם מאותה גרסה (Code.gs: ${serverVersion}, דף: ${page || 'ישן'}). ${how} הנתונים שלך בגיליון לא נפגעו.`);
  }

  /** Owner edits; everyone else views. The server enforces it; the page only hides the controls. */
  function setRole(lib) {
    S.role = lib.role === 'owner' ? 'owner' : 'viewer';
    if (S.role === 'owner' && lib.ownerKey) { S.ownerKey = lib.ownerKey; store.set('ownerKey', lib.ownerKey); }
    document.body.classList.toggle('viewer', S.role !== 'owner');
  }

  function start() {
    window.__bootState = 'האפליקציה עלתה';
    $('#boot').remove();
    document.body.insertAdjacentHTML('beforeend', '<div id="scroll-dock" class="scroll-dock" hidden></div>');
    const initial = document.body.dataset.view;
    if (document.body.dataset.remote) { S.remoteCode = document.body.dataset.remote; store.set('remoteCode', S.remoteCode); }
    S.route = { view: ['dashboard', 'songs', 'singers', 'favorites', 'playlists', 'add', 'settings', 'remote'].indexOf(initial) >= 0 ? initial : 'dashboard', id: null };
    // Direct link (?view=song&id=…): open that song / playlist / singer / chord.
    const linkId = document.body.dataset.id || '';
    if (linkId && ['song', 'playlist', 'singer', 'chords'].indexOf(initial) >= 0) S.route = { view: initial, id: linkId };
    render();
  }

  async function boot() {
    applyTheme();
    renderNav();
    window.__bootState = 'ממתין לתשובה מהשרת';
    const fresh = call('apiBootstrap');
    const slow = setTimeout(() => {
      const b = $('#boot');
      if (b && !b.querySelector('.boot-slow')) b.insertAdjacentHTML('beforeend', '<div class="boot-slow muted" style="max-width:420px;text-align:center;padding:0 16px">השרת של Google עונה לאט כרגע… הנתונים שלך שמורים. אם זה נמשך — <a href="#" onclick="location.reload();return false">נסה שוב</a>.</div>');
    }, 7000);
    fresh.then(() => clearTimeout(slow), () => clearTimeout(slow));
    let early = null;
    try {
      early = restoreLocal();
      if (early) { setRole(early); loadLibrary(early); start(); }
    } catch (e) {
      early = null; // a damaged local copy is ignored; the server copy follows
    }
    try {
      const lib = await fresh;
      window.__bootState = 'השרת ענה';
      checkBuild(lib.app.version, lib.indexBuild);
      setRole(lib);
      loadLibrary(lib);
    } catch (e) {
      window.__bootState = 'השרת החזיר שגיאה';
      if (early) { toast('מוצגת הגרסה השמורה במכשיר — ' + (e.message || 'אין חיבור לשרת'), 'err'); return; }
      $('#boot').innerHTML = `<div style="max-width:520px;text-align:center;padding:16px">לא ניתן לפתוח את האפליקציה:<br><b>${esc(e.message)}</b><br><br><button class="btn btn-accent" onclick="location.reload()">נסה שוב</button></div>`;
      return;
    }
    if (!early) start();
    else if (['dashboard', 'songs', 'singers', 'singer', 'favorites', 'playlists', 'playlist'].indexOf(S.route.view) >= 0 && !$('#modal-root').firstElementChild
      && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) render();
    else markNav();
    saveLibSnapshot();
    if (S.role !== 'owner') {
      // The first screen was already recorded when it was drawn; the visit start goes first.
      VT.q.unshift({ t: Date.now() - 1, ev: 'open', d: '' });
      if (!VT.t) VT.t = setTimeout(flushVisits, 5000);
      setTimeout(askVisitorName, 1200);
    } else VT.q = [];
    if (S.lib.backup && S.lib.backup.pending) scheduleFlush(1500);
    setTimeout(prefetchSongs, 1200);
  }

  boot();
})();
</script>

  </body>
